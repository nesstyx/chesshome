<style>
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); margin: 0; }

  .bc-page { max-width: 1140px; margin: 0 auto; padding: 20px 20px 50px; }

  /* ── шапка партии ─────────────────────────────────────── */
  .bc-topline { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bc-back {
    color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 5px 12px 5px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); transition: all .15s;
  }
  .bc-back:hover { color: var(--accent); border-color: var(--accent-dark); }

  .bc-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 18px; }
  .bc-name {
    font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.3px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bc-badge {
    flex: none; font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-card);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .bc-badge.live { color: var(--red); border-color: rgba(224,85,85,.5); background: rgba(224,85,85,.08); animation: bcPulse 1.4s infinite; }
  .bc-badge.finished { color: var(--green); border-color: rgba(76,175,114,.5); background: rgba(76,175,114,.08); }
  .bc-badge.upcoming { color: var(--accent-light); border-color: rgba(201,168,76,.5); background: rgba(201,168,76,.08); }
  @keyframes bcPulse { 0% { box-shadow: 0 0 0 0 rgba(224,85,85,.45); } 70% { box-shadow: 0 0 0 8px rgba(224,85,85,0); } 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0); } }

  select#game-select {
    background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; max-width: 260px; font-family: var(--font-body);
  }

  /* ── раскладка ────────────────────────────────────────── */
  .bc-layout { display: flex; gap: 18px; align-items: flex-start; }
  .bc-board-col { flex: 1; min-width: 0; }

  /* ── панели игроков ───────────────────────────────────── */
  .bc-player {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 10px; min-height: 46px;
    transition: border-color .2s, box-shadow .2s;
  }
  .bc-player.turn { border-color: var(--accent-dark); box-shadow: 0 0 14px rgba(201,168,76,.12); }
  .bc-player .p-chip {
    flex: none; width: 34px; height: 34px; border-radius: 8px; overflow: hidden;
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
  }
  .bc-player .p-chip img { width: 26px; height: 26px; }
  .bc-player .p-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bc-player .p-rating { color: var(--text-secondary); font-size: 13px; flex: none; }
  .bc-player .p-clock {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
    padding: 4px 12px; border-radius: 8px; background: var(--bg-secondary); color: var(--text-secondary);
    min-width: 86px; text-align: center;
  }
  .bc-player .p-clock.turn { background: var(--accent); color: #161820; }

  /* ── доска ────────────────────────────────────────────── */
  .board-zone {
    display: flex; gap: 0; max-width: 740px; margin: 0 auto;
    align-items: stretch;
  }
  .eval-bar {
    flex: none; width: 18px; margin-right: 10px; border-radius: 6px; overflow: hidden;
    background: #26241f; border: 1px solid var(--border-light); position: relative; display: flex; flex-direction: column;
  }
  .eval-bar .white-part { background: #e8e2d0; transition: height .5s ease; width: 100%; margin-top: auto; }
  .eval-bar .eval-num {
    position: absolute; left: 50%; top: 3px; transform: translateX(-50%);
    font-size: 8px; font-weight: 700; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
  }

  .board-outer { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .board-center { display: flex; }
  .rank-col {
    flex: none; width: 18px; display: flex; flex-direction: column;
    justify-content: space-around; align-items: center;
    font-size: 10px; font-weight: 700; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;
  }
  .board-and-files { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: min(100%, calc(100vh - 280px), 700px); max-width: 700px; aspect-ratio: 1 / 1;
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(201,168,76,.25);
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
    margin: 0; flex: 1;
  }
  #board .sq { position: relative; }
  #board .sq.light { background: var(--board-light); }
  #board .sq.dark  { background: var(--board-dark); }
  #board .sq.hl::after { content: ''; position: absolute; inset: 0; background: var(--board-highlight); }
  #board .sq img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; pointer-events: none; }

  .file-row {
    display: grid; grid-template-columns: repeat(8, 1fr);
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace; text-align: center; padding-top: 4px;
    width: min(100%, calc(100vh - 280px), 700px); max-width: 700px;
  }

  .bc-under { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; max-width: 700px; margin-left: auto; margin-right: auto; }
  .bc-status { color: var(--text-secondary); font-size: 13px; }
  .bc-btns .btn { margin-left: 6px; }

  /* ── правая колонка ───────────────────────────────────── */
  .bc-side { width: 300px; flex: none; display: flex; flex-direction: column; gap: 12px; }

  .bc-panel {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.7;
  }
  .bc-panel b { color: var(--text-primary); }
  .bc-panel h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent); font-weight: 700;
  }
  .bc-panel a { color: var(--accent); text-decoration: none; }
  .bc-panel a:hover { text-decoration: underline; }

  #movelist {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    flex: 1; min-height: 220px; max-height: calc(100vh - 320px); overflow-y: auto;
    padding: 10px; display: grid; grid-template-columns: 36px 1fr 1fr; gap: 2px 4px; align-content: start;
    font-size: 14px;
  }
  #movelist .mv-num {
    color: var(--text-muted); text-align: right; padding: 4px 6px 4px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  #movelist .mv {
    padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace; font-size: 13.5px; transition: background .1s;
  }
  #movelist .mv:hover { background: var(--bg-hover); }
  #movelist .mv.active { background: var(--accent-dark); color: #fff; }

  .bc-empty { text-align: center; color: var(--text-secondary); padding: 60px 20px; }

  /* ── панель анализа ───────────────────────────────────── */
  .bc-analysis { padding: 12px 14px; }
  .eng-status { color: var(--text-muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .eng-hint { color: var(--text-muted); font-size: 12px; line-height: 1.6; }
  .eng-node { margin: 0 0 12px; }
  .eng-node:last-child { margin-bottom: 4px; }
  .eng-node-title {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .8px; margin-bottom: 5px;
    display: flex; align-items: center; gap: 6px;
  }
  .eng-node-title .cur-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .eng-line {
    display: flex; align-items: baseline; gap: 7px;
    padding: 5px 8px; border-radius: 7px; margin-bottom: 3px;
    background: var(--bg-secondary); border: 1px solid var(--border);
    animation: engIn .25s ease;
    flex-wrap: wrap;
  }
  .eng-line:hover { border-color: var(--border-light); }
  @keyframes engIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .eng-score {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 1px 7px; border-radius: 6px; min-width: 46px; text-align: center;
  }
  .eng-score.w { background: rgba(76,175,114,.12); color: var(--green); }
  .eng-score.b { background: rgba(224,85,85,.12); color: var(--red); }
  .eng-score.m { background: rgba(201,168,76,.15); color: var(--accent-light); }
  .eng-pv { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; word-spacing: 2px; }
  .eng-pv .pvmove { cursor: pointer; padding: 1px 3px; border-radius: 4px; color: var(--text-primary); transition: background .1s; }
  .eng-pv .pvmove:hover { background: var(--bg-hover); color: var(--accent-light); }
  .eng-pv .pvmove.sel { background: var(--accent-dark); color: #fff; }
  #btn-back-game { margin-top: 8px; }

  @media (max-width: 800px) {
    .bc-layout { flex-direction: column; align-items: stretch; }
    .bc-side { width: 100%; }
    .bc-board-col, .bc-player, .board-zone, .bc-under { width: 100%; max-width: 100%; box-sizing: border-box; }
    #movelist { max-height: 300px; }
    .bc-name { font-size: 20px; white-space: normal; }
    .eval-bar { width: 12px; margin-right: 6px; }
    #board, .file-row { width: 100%; max-width: none; }
  }
</style>

<body>

<!-- header injected by /js/header.js -->

<div class="bc-page">
  <div class="bc-topline">
    <a class="bc-back" href="/broadcasts">← Все трансляции</a>
    <select id="game-select" style="display:none"></select>
  </div>

  <div class="bc-head">
    <div class="bc-name" id="bc-name">Загрузка…</div>
    <div class="bc-badge" id="bc-badge"></div>
  </div>

  <div class="bc-layout">
    <div class="bc-board-col">
      <div class="bc-player" id="bar-top"><span class="p-chip" id="chip-top"></span><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>

        </div>
        <div class="board-outer">
          <div class="board-center">
            <div class="rank-col" id="rank-col"></div>
            <div class="board-and-files">
              <div id="board"></div>

            </div>
          </div>
        </div>
      </div>

      <div class="bc-player" id="bar-bottom" style="margin-top:10px"><span class="p-chip" id="chip-bottom"></span><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>

      <div class="bc-under">
        <div class="bc-status" id="bc-status"></div>
        <div class="bc-btns">
          <button class="btn btn-ghost btn-sm" id="btn-engine">🔬 Анализ</button>
          <button class="btn btn-ghost btn-sm" id="btn-latest" style="display:none">⏭ К последнему ходу</button>

        </div>

    </div>

    <div class="bc-side">
      <div class="bc-panel" id="bc-info">—</div>
      <div class="bc-panel bc-analysis" id="analysis-panel" style="display:none">
        <h4>🔬 Анализ движком <span id="engine-status" class="eng-status"></span></h4>
        <div id="analysis-tree"><div class="eng-hint">Движок запускается при первом включении. Варианты появятся здесь.</div></div>
        <button class="btn btn-ghost btn-sm" id="btn-back-game" style="display:none">⤺ Вернуться к партии</button>
      </div>
      <div id="movelist"></div>
    </div>
  </div>

  <div class="bc-empty" id="bc-error" style="display:none"></div>

<script>
(function () {
  'use strict';

  const ID = location.pathname.split('/')[2] || '';
  const POLL_MS = 2000;

  // ── состояние ────────────────────────────────────────────────────
  let data = null;            // ответ сервера
  let games = [];             // распарсенные партии PGN
  let gameIdx = 0;
  let viewPly = -1;           // сколько ходов показываем; -1 = последний
  let follow = true;          // следить за последним ходом
  let flipped = false;
  let lastUpdatedAt = null;
  let stopped = false;

  // ── состояние движка ─────────────────────────────────────────────
  let engineOn = false;
  let sf = null;                // Worker с stockfish.js
  let sfReady = false;
  let engNodes = new Map();     // key 'gameIdx:ply' -> { fen, ply, gameIdx, lines:{}, done }
  let engBusyKey = null;        // что сейчас считает движок
  let preview = null;           // { key, lineIdx, moveIdx } — превью варианта на доске
  let treeDirty = false;

  // ── утилиты ──────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtTime(ms) {
    if (!ms) return '';
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  // ── header сайта ─────────────────────────────────────────────────
  if (window.CH && typeof CH.initHeader === 'function') CH.initHeader();

  // ── парсинг PGN ──────────────────────────────────────────────────
  function parsePgn(pgnText) {
    const chunks = pgnText.split(/\n(?=\[Event )/).map(s => s.trim()).filter(s => s.startsWith('[Event'));
    const out = [];
    for (const chunk of chunks) {
      const headers = {};
      chunk.replace(/\[(\w+)\s+"([^"]*)"\]/g, (m, k, v) => { headers[k] = v; return m; });
      const clk = [];
      chunk.replace(/\[%clk\s+([^\]\s]+)\s*\]/g, (m, v) => { clk.push(v); return m; });
      const evals = [];
      chunk.replace(/\[%eval\s+([^\]\s,]+)/g, (m, v) => { evals.push(v); return m; });

      try {
        const g = new Chess();
        g.loadPgn(chunk);
        const hist = g.history({ verbose: true });
        const tmp = new Chess();
        const fens = [tmp.fen()];
        for (const mv of hist) { try { tmp.move(mv.san); } catch (e) { break; } fens.push(tmp.fen()); }
        if (hist.length) out.push({ headers, clk, evals, hist, fens });
      } catch (e) { /* битый блок — пропускаем */ }
    }
    return out;
  }

  // ── доска ────────────────────────────────────────────────────────
  function fenBoard(fen) {
    const board = {};
    const rows = fen.split(' ')[0].split('/');
    for (let r = 0; r < 8; r++) {
      let file = 0;
      for (const ch of rows[r]) {
        if (ch >= '1' && ch <= '8') { file += +ch; continue; }
        const sq = 'abcdefgh'[file] + (8 - r);
        board[sq] = { t: ch.toLowerCase(), c: (ch === ch.toLowerCase()) ? 'b' : 'w' };
        file++;
      }
    }
    return board;
  }

  function renderCoords() {
    const files = flipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
    const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
    $('rank-col').innerHTML = ranks.map(r => '<div>' + r + '</div>').join('');
    $('file-row').innerHTML = files.map(f => '<div>' + f + '</div>').join('');
  }

  function renderBoard() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    let fen, lastMove;

    if (preview) {
      // превью варианта из дерева анализа
      const node = engNodes.get(preview.key);
      const line = node && node.lines[preview.lineIdx];
      if (line && line.fens && line.fens[preview.moveIdx]) {
        fen = line.fens[preview.moveIdx];
        const uci = line.pvUci[preview.moveIdx - 1] || '';
        lastMove = { from: uci.slice(0, 2), to: uci.slice(2, 4) };
      } else { preview = null; }
    }

    if (!preview) {
      fen = g ? g.fens[Math.min(k, g.fens.length - 1)] : new Chess().fen();
      lastMove = (g && k > 0) ? g.hist[k - 1] : null;
    }

    const board = fenBoard(fen);
    const el = $('board');
    el.innerHTML = '';
    const files = flipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
    const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];

    for (const r of ranks) {
      for (const f of files) {
        const sq = f + r;
        const cell = document.createElement('div');
        // a1 должна быть тёмной: (file + rank) нечётное → тёмное поле
        const dark = (files.indexOf(f) + r) % 2 === 1;
        cell.className = 'sq ' + (dark ? 'dark' : 'light');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) cell.classList.add('hl');
        const p = board[sq];
        if (p) {
          const img = document.createElement('img');
          img.src = PIECE_IMGS[p.c + p.t.toUpperCase()];
          img.alt = '';
          cell.appendChild(img);
        }
        el.appendChild(cell);
      }
    }
    renderCoords();
  }

  // ── eval-бар ─────────────────────────────────────────────────────
  function evalAt(g, k) {
    if (!g || !g.evals.length) return null;
    const i = k - 1; // evals[i] соответствует ходу i+1
    if (i < 0 || i >= g.evals.length) return i >= 0 ? g.evals[g.evals.length - 1] : null;
    return g.evals[i];
  }

  function renderEval() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    const e = evalAt(g, k);
    const bar = $('eval-bar');
    if (e == null) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    let whitePct = 50, label = '';
    if (e[0] === '#') {
      const m = parseInt(e.slice(1), 10);
      whitePct = isNaN(m) ? 50 : (m > 0 ? 100 : 0);
      label = 'M' + Math.abs(m || 1);
    } else {
      const v = parseFloat(e);
      if (isNaN(v)) { bar.style.display = 'none'; return; }
      // мягкая нелинейность: 50 + v*~4.2, зажата в 6..94
      whitePct = Math.max(6, Math.min(94, 50 + v * 4.2));
      label = (v > 0 ? '+' : '') + v.toFixed(1);
    }
    $('eval-white').style.height = whitePct + '%';
    $('eval-num').textContent = label;
  }

  // ── часы: последнее известное время каждой стороны на позиции k ──
  function clocksAt(g, k) {
    let w = null, b = null;
    for (let i = 0; i < k && i < g.clk.length; i++) {
      if (i % 2 === 0) w = g.clk[i]; else b = g.clk[i];
    }
    return { w, b };
  }

  // ── панели игроков ───────────────────────────────────────────────
  function playerName(g, side, fallback) {
    if (g && g.headers[side === 'w' ? 'White' : 'Black']) {
      const h = g.headers[side === 'w' ? 'White' : 'Black'];
      const elo = g.headers[side === 'w' ? 'WhiteElo' : 'BlackElo'];
      const title = g.headers[side === 'w' ? 'WhiteTitle' : 'BlackTitle'] || '';
      return { name: (title ? title + ' ' : '') + h, elo: elo || '' };
    }
    const fb = fallback ? fallback.split(/[,/]/).map(s => s.trim()) : [];
    const name = side === 'w' ? (data && data.white) || fb[0] : (data && data.black) || fb[1];
    return { name: name || (side === 'w' ? 'Белые' : 'Чёрные'), elo: '' };
  }

  function renderPlayers() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    const turn = k % 2 === 0 ? 'w' : 'b';
    const clk = g ? clocksAt(g, k) : { w: null, b: null };

    const bottomSide = flipped ? 'b' : 'w';
    const topSide = flipped ? 'w' : 'b';
    const fb = (data && data.white && data.black) ? data.white + '/' + data.black : '';

    const fill = (elId, chipId, side) => {
      const p = playerName(g, side, fb);
      const el = $(elId);
      el.querySelector('.p-name').textContent = p.name;
      el.querySelector('.p-rating').textContent = p.elo ? '(' + p.elo + ')' : '';
      const c = el.querySelector('.p-clock');
      c.textContent = (side === 'w' ? clk.w : clk.b) || '—';
      const isTurn = !!((side === 'w' ? clk.w : clk.b)) && turn === side && data.status === 'live';
      c.classList.toggle('turn', isTurn);
      el.classList.toggle('turn', isTurn);
      // фишка с фигурой цвета стороны
      const chip = $(chipId);
      const key = side === 'w' ? 'wK' : 'bK';
      if (typeof PIECE_IMGS !== 'undefined' && PIECE_IMGS[key] && !chip.dataset.done) {
        chip.innerHTML = '<img src="' + PIECE_IMGS[key] + '" alt="">';
        chip.dataset.done = '1';
      }
    };
    fill('bar-top', 'chip-top', topSide);
    fill('bar-bottom', 'chip-bottom', bottomSide);
  }

  // ── список ходов ─────────────────────────────────────────────────
  function renderMoves() {
    const g = games[gameIdx];
    const el = $('movelist');
    if (!g || !g.hist.length) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    const k = (viewPly < 0) ? g.hist.length : viewPly;
    let html = '';
    for (let i = 0; i < g.hist.length; i += 2) {
      html += `<div class="mv-num">${i / 2 + 1}.</div>`;
      html += `<div class="mv${(k === i + 1) ? ' active' : ''}" data-ply="${i + 1}">${esc(g.hist[i].san)}</div>`;
      html += g.hist[i + 1]
        ? `<div class="mv${(k === i + 2) ? ' active' : ''}" data-ply="${i + 2}">${esc(g.hist[i + 1].san)}</div>`
        : '<div></div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.mv').forEach(m => m.addEventListener('click', () => {
      viewPly = +m.getAttribute('data-ply');
      follow = false;
      preview = null;
      $('btn-back-game').style.display = 'none';
      renderAll();
    }));
    const act = el.querySelector('.mv.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }

  // ── статус/шапка ─────────────────────────────────────────────────
  function renderMeta() {
    if (!data) return;
    $('bc-name').textContent = data.name || 'Трансляция';

    const badge = $('bc-badge');
    badge.className = 'bc-badge ' + data.status;
    badge.textContent = data.status === 'live' ? '● Live'
      : data.status === 'finished' ? (data.result || 'завершён')
      : data.status === 'upcoming' ? 'скоро'
      : 'ожидание';

    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    let st = '';
    if (data.status === 'upcoming' || data.status === 'pending') {
      st = 'Начало: ' + fmtTime(data.startsAt);
    } else if (data.status === 'finished' && g) {
      st = 'Партия завершена: ' + (g.headers.Result || data.result || '');
    } else if (g && g.hist.length) {
      st = 'Идёт партия · ход ' + Math.ceil(k / 2);
    } else {
      st = 'Ожидание данных…';
    }
    $('bc-status').textContent = st;

    const ev = g ? g.headers.Event : null;
    const open = g ? (g.headers.Opening ? g.headers.Opening + (g.headers.ECO ? ' (' + g.headers.ECO + ')' : '') : '') : '';
    const tc = g ? g.headers.TimeControl : null;
    $('bc-info').innerHTML =
      '<h4>О трансляции</h4>' +
      (ev ? '<b>' + esc(ev) + '</b><br>' : '') +
      (data.description ? esc(data.description) + '<br>' : '') +
      (data.sourceUrl ? 'Источник: <a href="' + esc(data.sourceUrl) + '" target="_blank" rel="noopener">lichess.org</a><br>' : '') +
      (open ? 'Дебют: ' + esc(open) + '<br>' : '') +
      (tc ? 'Контроль: ' + esc(tc) : '');

    const sel = $('game-select');
    if (games.length > 1) {
      sel.style.display = '';
      if (sel.options.length !== games.length) {
        sel.innerHTML = games.map((gm, i) =>
          `<option value="${i}">${esc((gm.headers.White || 'W') + ' — ' + (gm.headers.Black || 'B'))}</option>`).join('');
        sel.value = String(gameIdx);
      }
    } else {
      sel.style.display = 'none';
    }

    $('btn-latest').style.display = (games.length && !follow && viewPly !== (games[gameIdx] ? games[gameIdx].hist.length : 0)) ? '' : 'none';
    document.title = (data.name || 'Трансляция') + ' — Chess Home';
  }

  function renderAll() { renderBoard(); renderPlayers(); renderMoves(); renderMeta(); renderEval(); if (engineOn) analyzeNow(); }

  // ── загрузка данных ──────────────────────────────────────────────
  async function load() {
    if (stopped || document.hidden) return;
    let d;
    try { d = await apiGet('/broadcasts/' + encodeURIComponent(ID)); }
    catch (e) {
      if (e.status === 404) {
        stopped = true;
        $('bc-error').style.display = '';
        $('bc-error').textContent = 'Трансляция не найдена';
        return;
      }
      return;
    }
    data = d;

    if (d.updatedAt !== lastUpdatedAt) {
      lastUpdatedAt = d.updatedAt;
      const parsed = d.pgn ? parsePgn(d.pgn) : [];
      if (parsed.length) {
        games = parsed;
        if (gameIdx >= games.length) gameIdx = 0;
        if (follow) viewPly = -1;
      }
      renderAll();
    } else {
      renderMeta();
    }
  }

  // ── движок: анализ вариантов ─────────────────────────────────────
  const ENGINE_DEPTH = 10;
  const ENGINE_LINES = 3;

  function currentKey() { return gameIdx + ':' + ((viewPly < 0) ? (games[gameIdx] ? games[gameIdx].hist.length : 0) : viewPly); }
  function currentFen() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    return g ? g.fens[Math.min(k, g.fens.length - 1)] : new Chess().fen();
  }

  function setStatus(txt) { $('engine-status').textContent = txt ? '· ' + txt : ''; }

  function ensureEngine() {
    if (sf) return sfReady;
    try {
      sf = new Worker('/js/stockfish.js');
      sf.onmessage = (e) => onEngMsg(e.data || e);
      sf.onerror = () => { setStatus('ошибка'); sfReady = false; };
      sf.postMessage('uci');
      setStatus('загрузка…');
      return sfReady;
    } catch (e) { setStatus('ошибка'); return false; }
  }

  function onEngMsg(d) {
    const s = typeof d === 'string' ? d : (d.data || d.line || String(d));
    if (s.indexOf('uciok') === 0) {
      sfReady = true;
      // ВАЖНО: только MultiPV. Смена Threads/Hash в этом билде (2019,
      // multi-variant) без последующего isready «подвешивает» поиск.
      sf.postMessage('setoption name MultiPV value ' + ENGINE_LINES);
      sf.postMessage('isready');
      setStatus('готов');
      analyzeNow();
      return;
    }
    if (s.indexOf('readyok') === 0) { setStatus('готов'); }
    // info depth N ... multipv M ... score cp|mate X ... pv <ходы>
    const m = s.match(/\bdepth (\d+)\b.*\bmultipv (\d+)\b.*\bscore (cp|mate) (-?\d+)\b.*\bpv (.+)$/);
    if (m && engBusyKey) {
      const node = engNodes.get(engBusyKey);
      if (!node) return;
      const score = parseInt(m[4], 10);
      // pv в SAN + FEN-ы по каждому полуходу
      const scratch = new Chess();
      try { scratch.load(node.fen); } catch (e) { return; }
      const uciList = m[5].trim().split(/\s+/);
      const san = [], fens = [node.fen], pvUci = [];
      for (const u of uciList) {
        const mv = { from: u.slice(0, 2), to: u.slice(2, 4) };
        if (u.length > 4) mv.promotion = u[4];
        try { const r = scratch.move(mv); san.push(r.san); } catch (e) { break; }
        pvUci.push(u);
        fens.push(scratch.fen());
      }
      node.lines[+m[2]] = { score, type: m[3], depth: +m[1], turn: node.fen.split(' ')[1] || 'w', san, fens, pvUci };
      scheduleTreeRender();
      if (+m[2] === 1) { node.done = false; }
    }
    if (s.indexOf('bestmove') === 0 && engBusyKey) {
      const node = engNodes.get(engBusyKey);
      if (node) node.done = true;
      engBusyKey = null;
      scheduleTreeRender();
    }
  }

  function analyzeNow() {
    if (!engineOn || !sfReady || stopped) return;
    const key = currentKey();
    let node = engNodes.get(key);
    if (!node) {
      node = { key, fen: currentFen(), ply: +key.split(':')[1], gameIdx, lines: {}, done: false };
      // не разрастаемся: держим последние 14 позиций
      if (engNodes.size >= 14) {
        const first = engNodes.keys().next().value;
        if (preview && preview.key === first) preview = null;
        engNodes.delete(first);
      }
      engNodes.set(key, node);
      scheduleTreeRender();
    } else if (node.done || engBusyKey === key) {
      return;
    }
    if (engBusyKey && engBusyKey !== key) sf.postMessage('stop');
    engBusyKey = key;
    node.done = false;
    sf.postMessage('position fen ' + node.fen);
    sf.postMessage('go depth ' + ENGINE_DEPTH);
    setStatus('думаю…');
  }

  let treeTimer = null;
  function scheduleTreeRender() {
    if (treeTimer) { treeDirty = true; return; }
    renderTree();
    treeTimer = setTimeout(() => { treeTimer = null; if (treeDirty) { treeDirty = false; scheduleTreeRender(); } }, 150);
  }

  function fmtScore(line) {
    if (line.type === 'mate') {
      return line.score === 0 ? 'M0' : 'M' + Math.abs(line.score);
    }
    // perspective движка = сторона, чей ход; переводим в перспективу белых
    const cp = line.turn === 'w' ? line.score : -line.score;
    return (cp > 0 ? '+' : '') + (cp / 100).toFixed(1);
  }
  function scoreClass(line) {
    if (line.type === 'mate') return 'm';
    const cp = line.turn === 'w' ? line.score : -line.score;
    return cp >= 0 ? 'w' : 'b';
  }

  function renderTree() {
    if (!engineOn) { $('analysis-tree').innerHTML = '<div class="eng-hint">Анализ выключен.</div>'; return; }
    const keys = [...engNodes.keys()].sort((a, b) => (+a.split(':')[1]) - (+b.split(':')[1]));
    if (!keys.length) { $('analysis-tree').innerHTML = '<div class="eng-hint">Варианты появятся здесь…</div>'; return; }

    let html = '';
    for (const key of keys) {
      const node = engNodes.get(key);
      const isCur = key === currentKey();
      const num = Math.ceil(node.ply / 2);
      const title = node.ply === 0 ? 'Начальная позиция'
        : 'После хода ' + num + (node.ply % 2 ? ' белыми' : ' чёрными')
        + (games[gameIdx] && games[gameIdx].hist[node.ply - 1] ? ' · ' + esc(games[gameIdx].hist[node.ply - 1].san) : '');
      html += '<div class="eng-node"><div class="eng-node-title">' + (isCur ? '<span class="cur-dot"></span>' : '') + esc(title) + '</div>';
      const idxs = Object.keys(node.lines).sort((a, b) => a - b);
      if (!idxs.length) html += '<div class="eng-hint">считаю…</div>';
      for (const li of idxs) {
        const line = node.lines[li];
        if (!line.san.length) continue;
        html += '<div class="eng-line"><span class="eng-score ' + scoreClass(line) + '">' + fmtScore(line) + '</span><span class="eng-pv">';
        for (let j = 0; j < line.san.length; j++) {
          const mvNum = (node.ply + j) % 2 === 0 ? Math.ceil((node.ply + j + 1) / 2) + '. ' : '';
          const sel = preview && preview.key === key && preview.lineIdx === +li && preview.moveIdx === j + 1;
          html += '<span class="pvmove' + (sel ? ' sel' : '') + '" data-key="' + key + '" data-li="' + li + '" data-j="' + j + '">' + mvNum + esc(line.san[j]) + '</span> ';
        }
        html += '</span></div>';
      }
      html += '</div>';
    }
    $('analysis-tree').innerHTML = html;
    $('analysis-tree').querySelectorAll('.pvmove').forEach(el => {
      el.addEventListener('click', () => {
        preview = { key: el.getAttribute('data-key'), lineIdx: +el.getAttribute('data-li'), moveIdx: +el.getAttribute('data-j') + 1 };
        $('btn-back-game').style.display = '';
        renderBoard();
        scheduleTreeRender();
      });
    });
    $('btn-back-game').style.display = preview ? '' : 'none';
  }

  function toggleEngine() {
    engineOn = !engineOn;
    $('btn-engine').classList.toggle('btn-primary', engineOn);
    $('btn-engine').classList.toggle('btn-ghost', !engineOn);
    $('analysis-panel').style.display = engineOn ? '' : 'none';
    if (engineOn) {
      preview = null;
      if (ensureEngine()) analyzeNow(); else renderTree();
    } else {
      if (sf) { sf.postMessage('stop'); sf.terminate(); sf = null; sfReady = false; }
      engNodes.clear(); preview = null; engBusyKey = null;
      setStatus('');
      renderTree();
      renderBoard();
    }
  }


  $('btn-flip').addEventListener('click', () => { flipped = !flipped; renderBoard(); renderPlayers(); });
  $('btn-latest').addEventListener('click', () => { follow = true; viewPly = -1; renderAll(); });
  $('btn-engine').addEventListener('click', toggleEngine);
  $('btn-back-game').addEventListener('click', () => { preview = null; $('btn-back-game').style.display = 'none'; renderBoard(); scheduleTreeRender(); });
  $('game-select').addEventListener('change', (e) => {
    gameIdx = +e.target.value; viewPly = -1; follow = true; preview = null; renderAll();
  });

  // стрелки ← → для листания ходов
  document.addEventListener('keydown', (e) => {
    const g = games[gameIdx];
    if (!g) return;
    const max = g.hist.length;
    const cur = (viewPly < 0) ? max : viewPly;
    if (e.key === 'ArrowLeft' && cur > 0) { viewPly = cur - 1; follow = viewPly === max; preview = null; renderAll(); }
    if (e.key === 'ArrowRight' && cur < max) { viewPly = cur + 1; follow = viewPly === max; preview = null; renderAll(); }
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  // ── старт ────────────────────────────────────────────────────────
  renderBoard();
  load();
  setInterval(load, POLL_MS);
})();
</script>

</body>
</html>
