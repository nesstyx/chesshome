<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трансляция — Chess Home</title>
  <meta name="description" content="Трансляция шахматной партии в реальном времени">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/utils.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pieces.js"></script>
  <script src="/js/vendor/chess.js"></script>
  <script src="/js/chess-engine.js"></script>
  <script src="/js/board.js"></script>
  <script src="/js/header/core.js"></script>
  <script src="/js/header/styles.js"></script>
  <script src="/js/header/render.js"></script>
  <script src="/js/header/right.js"></script>
  <script src="/js/header/api.js"></script>
  <link rel="icon" type="image/png" href="/img/logo/favicon.png">
<style>
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); margin: 0; }

  .bc-page { max-width: 1400px; margin: 0 auto; padding: 20px 20px 50px; }

  /* ── шапка партии ─────────────────────────────────────── */
  .bc-topline { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .bc-back {
    color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 5px 12px 5px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); transition: all .15s;
  }
  .bc-back:hover { color: var(--accent); border-color: var(--accent-dark); }

  .bc-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 18px; }
  .bc-name {
    font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.3px;
  }
  .bc-badge {
    flex: none; font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-card);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .bc-badge.live { color: var(--red); border-color: rgba(224,85,85,.5); background: rgba(224,85,85,.08); animation: bcPulse 1.4s infinite; }
  .bc-badge.finished { color: var(--green); border-color: rgba(76,175,114,.5); background: rgba(76,175,114,.08); }
  .bc-badge.upcoming { color: var(--accent-light); border-color: rgba(201,168,76,.5); background: rgba(201,168,76,.08); }
  @keyframes bcPulse { 0% { box-shadow: 0 0 0 0 rgba(224,85,85,.45); } 70% { box-shadow: 0 0 0 8px rgba(224,85,85,0); } 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0); } }

  select#game-select {
    background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; max-width: 260px; font-family: var(--font-body);
  }

  /* ── раскладка как на странице анализа ────────────────── */
  .bc-layout { display: flex; gap: 22px; align-items: flex-start; justify-content: center; }
  .bc-chat-col { width: 280px; flex: none; display: flex; flex-direction: column; }
  .bc-chat-col .bc-chat { flex: 1; }
  .bc-board-col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; }
  .bc-side { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 300px; max-width: 380px; }

  .board-row { display: flex; gap: 10px; align-items: stretch; }

  /* доска из /js/board.js задаёт размер инлайном — не даём вылезти
     за пределы нашей колонки (в анализе колонка шире) */
  .board-wrapper { width: 100%; display: block; }
  #chess-board { max-width: 100% !important; height: auto !important; aspect-ratio: 1 / 1; margin: 0 auto; }

  .eval-bar-container {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    background: #23252e; width: 26px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  #eval-bar-fill { width: 100%; height: 50%; background: #ececf2; transition: height .35s ease; }
  .eval-bar-mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(201,168,76,0.45); pointer-events: none; }
  #eval-bar-label {
    position: absolute; left: 0; right: 0; text-align: center;
    font: 700 9.5px 'JetBrains Mono', monospace; pointer-events: none; z-index: 2;
    bottom: 5px; color: #181a22;
  }
  #eval-bar-label.neg { top: 5px; bottom: auto; color: #ececf2; }

  .an-controls { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .an-controls .sp { flex: 1; }
  .an-controls span { font: 12px 'JetBrains Mono', monospace; color: var(--text-muted); margin: 0 6px; }

  /* ── панели игроков ───────────────────────────────────── */
  .bc-player {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 10px; min-height: 46px; max-width: 720px;
    transition: border-color .2s, box-shadow .2s;
  }
  .bc-player.turn { border-color: var(--accent-dark); box-shadow: 0 0 14px rgba(201,168,76,.12); }
  .bc-player .p-chip {
    flex: none; width: 34px; height: 34px; border-radius: 8px; overflow: hidden;
    background: var(--bg-secondary); border: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: center;
  }
  .bc-player .p-chip img { width: 26px; height: 26px; }
  .bc-player .p-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bc-player .p-rating { color: var(--text-secondary); font-size: 13px; flex: none; }
  .bc-player .p-clock {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700;
    padding: 4px 12px; border-radius: 8px; background: var(--bg-secondary); color: var(--text-secondary);
    min-width: 86px; text-align: center;
  }
  .bc-player .p-clock.turn { background: var(--accent); color: #161820; }
  .bc-player .p-clock.low { background: rgba(224,85,85,.15); color: var(--red); }
  .bc-player .p-clock.low.turn { background: var(--red); color: #fff; }

  .bc-under { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .bc-status { color: var(--text-secondary); font-size: 13px; }

  /* ── правая колонка ───────────────────────────────────── */
  .bc-panel {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.7;
  }
  .bc-panel b { color: var(--text-primary); }
  .bc-panel h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent); font-weight: 700;
  }
  .bc-panel a { color: var(--accent); text-decoration: none; }
  .bc-panel a:hover { text-decoration: underline; }

  #movelist {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    min-height: 220px; max-height: calc(100vh - 320px); overflow-y: auto;
    padding: 10px; display: grid; grid-template-columns: 36px 1fr 1fr; gap: 2px 4px; align-content: start;
    font-size: 14px;
  }
  #movelist .mv-num {
    color: var(--text-muted); text-align: right; padding: 4px 6px 4px 0;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  #movelist .mv {
    padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace; font-size: 13.5px; transition: background .1s;
  }
  #movelist .mv:hover { background: var(--bg-hover); }
  #movelist .mv.active { background: var(--accent-dark); color: #fff; }
  /* ходы локального варианта зрителя */
  #movelist .mv.var { color: var(--accent-light); }
  #movelist .mv.var.active { background: var(--accent-dark); color: #fff; }
  #movelist .var-sep {
    grid-column: 1 / -1; margin: 4px 0 2px; padding: 3px 8px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent-light); border-top: 1px dashed rgba(201,168,76,.4);
  }
  #btn-latest.pulse { animation: bcPulseGold 1.4s infinite; }
  @keyframes bcPulseGold { 0% { box-shadow: 0 0 0 0 rgba(201,168,76,.5); } 70% { box-shadow: 0 0 0 8px rgba(201,168,76,0); } 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0); } }

  .bc-empty { text-align: center; color: var(--text-secondary); padding: 60px 20px; }

  /* ── панель анализа (как в анализе: оценка + глубина/ход + 2 линии) ── */
  .bc-analysis { padding: 12px 14px; }
  .eng-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .eng-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 700; font-family: var(--font-body);
    padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all .15s;
    background: var(--bg-secondary); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .eng-toggle.on { background: var(--accent); color: #161820; border-color: var(--accent-dark); }
  .eng-status { color: var(--text-muted); font-weight: 500; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eng-status.thinking::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 5px; animation: bcPulse 1.4s infinite;
  }
  .eng-main {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 11px; margin-bottom: 10px; text-align: center;
  }
  .eng-score-big {
    font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700;
    color: var(--text-primary); line-height: 1.1; letter-spacing: -0.5px;
    transition: color .2s;
  }
  .eng-score-big.w { color: var(--green); }
  .eng-score-big.b { color: var(--red); }
  .eng-score-big.m { color: var(--accent-light); }
  .eng-meta {
    display: flex; justify-content: center; gap: 14px; margin-top: 5px;
    font-size: 12px; color: var(--text-secondary);
  }
  .eng-meta b { color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }
  .eng-hint { color: var(--text-muted); font-size: 12px; line-height: 1.6; }
  .eng-line {
    display: flex; align-items: baseline; gap: 7px;
    padding: 5px 8px; border-radius: 7px; margin-bottom: 3px;
    background: var(--bg-secondary); border: 1px solid var(--border);
    animation: engIn .25s ease;
    flex-wrap: wrap;
  }
  .eng-line:hover { border-color: var(--border-light); }
  @keyframes engIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .eng-score {
    flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    padding: 1px 7px; border-radius: 6px; min-width: 46px; text-align: center;
  }
  .eng-score.w { background: rgba(76,175,114,.12); color: var(--green); }
  .eng-score.b { background: rgba(224,85,85,.12); color: var(--red); }
  .eng-score.m { background: rgba(201,168,76,.15); color: var(--accent-light); }
  .eng-pv { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; word-spacing: 2px; }
  .eng-pv .pvmove { cursor: pointer; padding: 1px 3px; border-radius: 4px; color: var(--text-primary); transition: background .1s; }
  .eng-pv .pvmove:hover { background: var(--bg-hover); color: var(--accent-light); }
  .eng-pv .pvmove.sel { background: var(--accent-dark); color: #fff; }
  #btn-back-game { margin-top: 8px; }

  /* ── чат трансляции (слева, пузыри как в анализе) ─────── */
  .bc-chat { padding: 12px 14px; display: flex; flex-direction: column; }
  #chat-messages {
    flex: 1; min-height: 120px; max-height: 640px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px;
    scrollbar-width: thin;
  }
  .chat-msg { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; animation: engIn .2s ease; max-width: 100%; }
  .chat-msg.mine { align-items: flex-end; }
  .c-name { font-size: 11px; font-weight: 700; color: var(--accent-light); padding: 0 4px; }
  .c-row { display: flex; align-items: center; gap: 4px; max-width: 100%; }
  .chat-msg.mine .c-row { flex-direction: row-reverse; }
  .c-text {
    background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px;
    padding: 6px 11px; font-size: 13px; line-height: 1.45; color: var(--text-primary);
    word-break: break-word;
  }
  .chat-msg.mine .c-text { background: rgba(201,168,76,.12); border-color: rgba(201,168,76,.35); }
  .c-del {
    cursor: pointer; color: var(--text-muted); font-size: 11px;
    user-select: none; transition: color .1s; flex: none;
  }
  .c-del:hover { color: var(--red); }
  .chat-hint { color: var(--text-muted); font-size: 12px; }
  .chat-hint a { color: var(--accent); }
  #chat-form { display: flex; gap: 6px; }
  #chat-input {
    flex: 1; min-width: 0; background: var(--bg-secondary); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    font-family: var(--font-body); outline: none;
  }
  #chat-input:focus { border-color: var(--accent-dark); }
  #chat-send { flex: none; }

  @media (max-width: 980px) {
    .bc-layout { flex-direction: column; align-items: stretch; }
    .bc-chat-col, .bc-side { width: 100%; max-width: none; }
    .bc-side { order: 2; }
    .bc-chat-col { order: 3; }
    .bc-chat-col .bc-chat { flex: none; }
  }
  @media (max-width: 768px) {
    .bc-page { padding: 12px 10px 40px; }
    .bc-board-col, .bc-player, .bc-under { width: 100%; max-width: 100%; box-sizing: border-box; }
    #movelist { max-height: 300px; }
    .bc-name { font-size: 20px; white-space: normal; }
    .eval-bar-container { display: none; }
    .board-wrapper { display: flex; justify-content: center; }
    #chess-board { width: min(calc(100vw - 16px), 480px) !important; height: min(calc(100vw - 16px), 480px) !important; max-width: 100% !important; }
    .eng-score-big { font-size: 24px; }
    #chat-messages { max-height: 240px; }
  }
</style>
</head>
<body>

<!-- header injected by /js/header.js -->

<div class="bc-page">
  <div class="bc-topline">
    <a class="bc-back" href="/broadcasts">← Все трансляции</a>
    <select id="game-select" style="display:none"></select>
  </div>

  <div class="bc-head">
    <div class="bc-name" id="bc-name">Загрузка…</div>
    <div class="bc-badge" id="bc-badge"></div>
  </div>

  <div class="bc-layout">
    <!-- чат — слева, как в анализе -->
    <div class="bc-chat-col">
      <div class="bc-panel bc-chat" id="chat-panel">
        <h4>💬 Чат трансляции</h4>
        <div id="chat-messages"><div class="chat-hint">Загрузка…</div></div>
        <form id="chat-form" style="display:none">
          <input id="chat-input" maxlength="300" placeholder="Сообщение…" autocomplete="off">
          <button type="submit" class="btn btn-primary btn-sm" id="chat-send">➤</button>
        </form>
        <div class="chat-hint" id="chat-login-hint" style="display:none"></div>
      </div>
    </div>

    <div class="bc-board-col">
      <div class="bc-player" id="bar-top"><span class="p-chip" id="chip-top"></span><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>

      <div class="board-row">
        <div class="eval-bar-container" id="eval-bar-container" style="display:none">
          <div class="eval-bar-mid"></div>
          <div id="eval-bar-fill"></div>
          <span id="eval-bar-label">0.0</span>
        </div>
        <!-- доска из /js/board.js (как на странице анализа) -->
        <div class="board-wrapper" id="game-board-container"></div>
      </div>

      <div class="an-controls">
        <button class="btn btn-ghost btn-sm" id="nav-first" title="В начало (↑)">⏮</button>
        <button class="btn btn-ghost btn-sm" id="nav-prev" title="Назад (←)">◀</button>
        <button class="btn btn-ghost btn-sm" id="nav-next" title="Вперёд (→)">▶</button>
        <button class="btn btn-ghost btn-sm" id="nav-last" title="В конец (↓)">⏭</button>
        <span id="move-counter">0 / 0</span>
        <div class="sp"></div>
        <button class="btn btn-ghost btn-sm" id="btn-latest" style="display:none">⤝ К последнему ходу</button>
        <button class="btn btn-ghost btn-sm" id="btn-flip" title="Развернуть (F)">↕ Развернуть</button>
      </div>

      <div class="bc-player" id="bar-bottom" style="margin-top:10px"><span class="p-chip" id="chip-bottom"></span><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>

      <div class="bc-under">
        <div class="bc-status" id="bc-status"></div>
      </div>
    </div>

    <div class="bc-side">
      <div class="bc-panel" id="bc-info">—</div>
      <div class="bc-panel bc-analysis" id="analysis-panel" style="display:none">
        <div class="eng-head">
          <button class="eng-toggle on" id="btn-engine">⏸ Движок включён</button>
          <span class="eng-status" id="engine-status">Анализирует…</span>
        </div>
        <div class="eng-main">
          <div class="eng-score-big" id="eng-score">—</div>
          <div class="eng-meta">
            <span>Глубина: <b id="eng-depth">—</b></span>
            <span>Лучший ход: <b id="eng-best">—</b></span>
          </div>
        </div>
        <div id="analysis-tree"><div class="eng-hint">Варианты появятся здесь. Клик по ходу — превью на доске.</div></div>
        <button class="btn btn-ghost btn-sm" id="btn-back-game" style="display:none">⤺ Вернуться к партии</button>
      </div>
      <div id="movelist"></div>
    </div>
  </div>

  <div class="bc-empty" id="bc-error" style="display:none"></div>
</div>

<!-- модалка превращения (нужна board.js, когда зритель проводит пешку в своём варианте) -->
<div class="modal-overlay" id="modal-promotion">
  <div class="modal promo-modal">
    <div class="promo-icon">👑</div>
    <h2>Превращение пешки</h2>
    <p style="color:var(--text-secondary);font-size:14px">Выберите фигуру</p>
    <div class="promo-pieces">
      <button class="promo-piece-btn" data-piece="Q"><img src="" alt="Q"></button>
      <button class="promo-piece-btn" data-piece="R"><img src="" alt="R"></button>
      <button class="promo-piece-btn" data-piece="B"><img src="" alt="B"></button>
      <button class="promo-piece-btn" data-piece="N"><img src="" alt="N"></button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const ID = location.pathname.split('/')[2] || '';
  const POLL_MS = 2000;

  // ── состояние ────────────────────────────────────────────────────
  let data = null;            // ответ сервера
  let games = [];             // распарсенные партии PGN
  let gameIdx = 0;
  let uciMoves = [];          // ходы текущей партии для board.js
  let preview = null;         // { key, lineIdx, moveIdx, restorePly } — превью варианта
  let lastUpdatedAt = null;
  let stopped = false;
  let newLiveMoves = false;   // пока зритель в своём варианте — пришли новые ходы трансляции

  // ── состояние движка ─────────────────────────────────────────────
  let engineOn = false;
  let sf = null;                // Worker с stockfish.js
  let sfReady = false;
  let engNodes = new Map();     // key 'gameIdx:ply' -> { fen, ply, gameIdx, lines:{}, done }
  let engBusyKey = null;        // что сейчас считает движок
  let treeDirty = false;

  // ── утилиты ──────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  // кто смотрит (для чата: право удаления своих/любых сообщений)
  let me = null;
  apiGet('/me').then(u => { me = u; initChat(); }).catch(() => initChat());

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtTime(ms) {
    if (!ms) return '';
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  // ── header сайта ─────────────────────────────────────────────────
  if (window.CH && typeof CH.initHeader === 'function') CH.initHeader();

  // ── парсинг PGN ──────────────────────────────────────────────────
  function parsePgn(pgnText) {
    const chunks = pgnText.split(/\n(?=\[Event )/).map(s => s.trim()).filter(s => s.startsWith('[Event'));
    const out = [];
    for (const chunk of chunks) {
      const headers = {};
      chunk.replace(/\[(\w+)\s+"([^"]*)"\]/g, (m, k, v) => { headers[k] = v; return m; });
      const clk = [];
      chunk.replace(/\[%clk\s+([^\]\s]+)\s*\]/g, (m, v) => { clk.push(v); return m; });
      const evals = [];
      chunk.replace(/\[%eval\s+([^\]\s,]+)/g, (m, v) => { evals.push(v); return m; });

      try {
        const g = new Chess();
        g.loadPgn(chunk);
        const hist = g.history({ verbose: true });
        const tmp = new Chess();
        const fens = [tmp.fen()];
        for (const mv of hist) { try { tmp.move(mv.san); } catch (e) { break; } fens.push(tmp.fen()); }
        if (hist.length) out.push({ headers, clk, evals, hist, fens });
      } catch (e) { /* битый блок — пропускаем */ }
    }
    return out;
  }

  // ── доска: используем chessBoard из /js/board.js (как в анализе) ─
  // ВАЖНО: board.js объявляет chessBoard через top-level const — это
  // глобальная лексическая привязка, в window её нет. Обращаемся напрямую.
  function cb() { return chessBoard; }

  function histLen() { const g = games[gameIdx]; return g ? g.hist.length : 0; }
  function curPly() { return cb() ? cb().viewIndex : 0; }
  function isFollowing() { return !preview && follow && curPly() >= histLen(); }

  function sqIdx(s) { return 'abcdefgh'.indexOf(s[0]) + (parseInt(s[1], 10) - 1) * 8; }

  // ── локальный вариант зрителя ──────────────────────────────────
  // Зритель может двигать фигуры — ходы остаются ТОЛЬКО у него на доске.
  // Вариант определяется тем, что FEN основной линии доски (getFEN)
  // отличается от финального FEN трансляции.
  function varMode() {
    if (preview || !boardSynced) return false;
    const g = games[gameIdx];
    if (!g || !g.fens.length) return false;
    return cb().getFEN() !== g.fens[Math.min(g.hist.length, g.fens.length - 1)];
  }

  // индекс первого хода в локальной истории, которого нет в трансляции
  function varStartIdx(h, g) {
    for (let i = 0; i < h.length; i++) {
      if (i >= g.hist.length) return i;
      const gm = g.hist[i];
      if (!h[i] || h[i].from !== sqIdx(gm.from) || h[i].to !== sqIdx(gm.to)) return i;
    }
    return h.length;
  }

  // базовое время из заголовка TimeControl ('600+2' → 600 сек, '120'/40m' → 7200 сек)
  function tcBaseSec(g) {
    if (!g || !g.headers || !g.headers.TimeControl) return null;
    const tc = String(g.headers.TimeControl);
    let m = tc.match(/^(\d+)\s*\+/);
    if (m) return parseInt(m[1], 10);
    m = tc.match(/^(\d+)\s*'/);
    if (m) return parseInt(m[1], 10) * 60;
    m = tc.match(/(\d+)\s*(?:min|м)\b/i);
    if (m) return parseInt(m[1], 10) * 60;
    return null;
  }

  function movesFor(hist) {
    return hist.map(mv => ({
      from: sqIdx(mv.from), to: sqIdx(mv.to),
      promotion: mv.promotion || undefined,
    }));
  }

  // Загрузить партию в доску и встать на позицию ply (0 = старт)
  function loadGame(g, ply) {
    inProgram = true;
    const wasFlipped = cb().flipped; // не сбрасываем переворот при обновлении партии
    uciMoves = movesFor(g.hist);
    cb().loadGameMoves(uciMoves);
    if (wasFlipped && !cb().flipped) cb().flipBoard();
    cb().gotoMove(Math.max(0, Math.min(ply, g.hist.length)));
    boardSynced = true;
    inProgram = false;
  }

  // follow — следим за последним ходом; меняется только действиями зрителя
  let follow = true;
  let inProgram = false;
  let boardSynced = false; // доска хоть раз загрузила партию трансляции

  function syncGame() {
    const g = games[gameIdx];
    if (!g) { cb().loadFEN(new Chess().fen()); return; }
    loadGame(g, follow ? g.hist.length : curPly());
  }

  // после любого рендера доски (навигация зчителя, его ходы-вариант,
  // переворот) — обновляем панели. Программные перезагрузки (inProgram)
  // игнорируем, чтобы не зациклиться.
  document.addEventListener('board:render', () => {
    if (inProgram) return;
    follow = !preview && curPly() >= histLen();
    bcRender();
  });

  // ── eval-бар (как в анализе) ─────────────────────────────────────
  function evalAt(g, k) {
    if (!g || !g.evals.length) return null;
    const i = k - 1; // evals[i] соответствует ходу i+1
    if (i < 0 || i >= g.evals.length) return i >= 0 ? g.evals[g.evals.length - 1] : null;
    return g.evals[i];
  }

  function bcRender() {
    renderPlayers(); renderMoves(); renderMeta(); renderEval();
    if (engineOn && !preview) analyzeNow();
  }

  function renderEval() {
    const g = games[gameIdx];
    const k = curPly();
    const e = (!preview && !varMode()) ? evalAt(g, k) : null;
    const cont = $('eval-bar-container');
    if (e == null) { cont.style.display = 'none'; return; }
    cont.style.display = '';
    let whitePct = 50, label = '';
    if (e[0] === '#') {
      const m = parseInt(e.slice(1), 10);
      whitePct = isNaN(m) ? 50 : (m > 0 ? 100 : 0);
      label = 'M' + Math.abs(m || 1);
    } else {
      const v = parseFloat(e);
      if (isNaN(v)) { cont.style.display = 'none'; return; }
      whitePct = Math.max(6, Math.min(94, 50 + v * 4.2));
      label = (v > 0 ? '+' : '') + v.toFixed(1);
    }
    $('eval-bar-fill').style.height = whitePct + '%';
    const lbl = $('eval-bar-label');
    lbl.textContent = label;
    lbl.classList.toggle('neg', e[0] !== '#' && parseFloat(e) < 0);
  }

  // ── часы: локальный тик каждую секунду ────────────────────────────
  // [%clk] в PGN стоят ПОСЛЕ каждого хода: clk[0] — время белых после
  // 1-го хода белых, clk[1] — время чёрных после их 1-го хода и т.д.
  // Когда приходит новый ход от lichess, отсчёт стартует от текущего
  // локального времени: remaining = база из [%clk] − (now − t_получения).
  function parseClk(s) {
    if (!s) return null;
    const p = String(s).split(':').map(Number);
    if (p.some(isNaN)) return null;
    if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
    if (p.length === 2) return p[0] * 60 + p[1];
    return null;
  }
  function fmtClock(sec) {
    if (sec == null) return '—';
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(2, '0'), ss = String(s).padStart(2, '0');
    return (h ? h + ':' + mm : m) + ':' + ss;
  }
  let liveClock = null; // { w, b, side, base, at }

  function computeLiveClock(g, k) {
    if (varMode()) return; // в локальном варианте часы трансляции не трогаем
    liveClock = null;
    if (!g || !data || data.status !== 'live' || k !== g.hist.length || !g.clk.length) return;
    // последние известные времена каждой стороны на позиции k
    let wStr = null, bStr = null;
    for (let i = 0; i < k && i < g.clk.length; i++) {
      if (i % 2 === 0) wStr = g.clk[i]; else bStr = g.clk[i];
    }
    // если сторона ещё не сделала ни одного хода — её время = база из TimeControl
    const tb = tcBaseSec(g);
    const ws = parseClk(wStr) != null ? parseClk(wStr) : tb;
    const bs = parseClk(bStr) != null ? parseClk(bStr) : tb;
    if (ws == null && bs == null) return;
    // сыграно k полуходов: k чётное → ход белых, нечётное → чёрных.
    // ТИКАЕТ та сторона, ЧЕЙ СЕЙЧАС ХОД (а не та, что сходила).
    const side = k % 2 === 0 ? 'w' : 'b';
    liveClock = {
      w: ws, b: bs, side,
      base: side === 'w' ? ws : bs, // база ИДУЩЕЙ стороны
      at: Date.now(),               // старт отсчёта — текущее локальное время
    };
  }

  function renderClocksOnly() {
    if (!liveClock) return;
    const rem = Math.max(0, liveClock.base - (Date.now() - liveClock.at) / 1000);
    // у идущей стороны — локальный отсчёт, у второй — последнее известное
    const clockOf = (side) => side === liveClock.side
      ? rem
      : (side === 'w' ? liveClock.w : liveClock.b);
    const fill = (elId, side) => {
      const c = $(elId).querySelector('.p-clock');
      c.textContent = fmtClock(clockOf(side));
      c.classList.toggle('low', side === liveClock.side && rem < 30);
    };
    const flipped = cb() && cb().flipped;
    // без переворота: сверху чёрные, снизу белые
    fill('bar-top', flipped ? 'w' : 'b');
    fill('bar-bottom', flipped ? 'b' : 'w');
  }

  // ── панели игроков ───────────────────────────────────────────────
  function playerName(g, side, fallback) {
    if (g && g.headers[side === 'w' ? 'White' : 'Black']) {
      const h = g.headers[side === 'w' ? 'White' : 'Black'];
      const elo = g.headers[side === 'w' ? 'WhiteElo' : 'BlackElo'];
      const title = g.headers[side === 'w' ? 'WhiteTitle' : 'BlackTitle'] || '';
      return { name: (title ? title + ' ' : '') + h, elo: elo || '' };
    }
    const fb = fallback ? fallback.split(/[,/]/).map(s => s.trim()) : [];
    const name = side === 'w' ? (data && data.white) || fb[0] : (data && data.black) || fb[1];
    return { name: name || (side === 'w' ? 'Белые' : 'Чёрные'), elo: '' };
  }

  function renderPlayers() {
    const g = games[gameIdx];
    const vm = varMode();
    // в варианте зрителя «текущая позиция» = последняя позиция трансляции
    const k = vm && g ? g.hist.length : curPly();
    const turn = k % 2 === 0 ? 'w' : 'b'; // k полуходов сыграно: чётное → ход белых
    const clk = { w: null, b: null };
    if (g) {
      let wStr = null, bStr = null;
      for (let i = 0; i < k && i < g.clk.length; i++) {
        if (i % 2 === 0) wStr = g.clk[i]; else bStr = g.clk[i];
      }
      clk.w = wStr; clk.b = bStr;
    }
    computeLiveClock(g, k);
    // на последнем ходе живой трансляции — локальный отсчёт у идущей стороны
    if (liveClock) {
      const rem = Math.max(0, liveClock.base - (Date.now() - liveClock.at) / 1000);
      if (liveClock.side === 'w') clk.w = fmtClock(rem); else clk.b = fmtClock(rem);
    }
    // сторона ещё не сходила → показываем базовое время из TimeControl
    if (g) {
      const tb = tcBaseSec(g);
      if (clk.w == null && tb != null) clk.w = fmtClock(tb);
      if (clk.b == null && tb != null) clk.b = fmtClock(tb);
    }

    const flipped = cb() && cb().flipped;
    const bottomSide = flipped ? 'b' : 'w';
    const topSide = flipped ? 'w' : 'b';
    const fb = (data && data.white && data.black) ? data.white + '/' + data.black : '';

    const fill = (elId, chipId, side) => {
      const p = playerName(g, side, fb);
      const el = $(elId);
      el.querySelector('.p-name').textContent = p.name;
      el.querySelector('.p-rating').textContent = p.elo ? '(' + p.elo + ')' : '';
      const c = el.querySelector('.p-clock');
      c.textContent = (side === 'w' ? clk.w : clk.b) || '—';
      const isTurn = !!((side === 'w' ? clk.w : clk.b)) && turn === side && data.status === 'live';
      c.classList.toggle('turn', isTurn);
      el.classList.toggle('turn', isTurn);
      // фишка с фигурой цвета стороны
      const chip = $(chipId);
      const key = side === 'w' ? 'wK' : 'bK';
      if (typeof PIECE_IMGS !== 'undefined' && PIECE_IMGS[key] && !chip.dataset.done) {
        chip.innerHTML = '<img src="' + PIECE_IMGS[key] + '" alt="">';
        chip.dataset.done = '1';
      }
    };
    fill('bar-top', 'chip-top', topSide);
    fill('bar-bottom', 'chip-bottom', bottomSide);
  }

  // ── список ходов ─────────────────────────────────────────
  function renderMoves() {
    const g = games[gameIdx];
    const el = $('movelist');
    if (!g || !g.hist.length) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    const vm = varMode();
    const h = vm ? (cb().history || []) : null; // локальная история с вариантом
    const vStart = vm && h ? varStartIdx(h, g) : h ? h.length : g.hist.length;
    const src = vm && h && h.length ? h : g.hist;
    const k = preview ? -1 : (vm && h && h.length ? h.length : curPly());
    let html = '';
    for (let i = 0; i < src.length; i += 2) {
      // разделитель «ваш вариант» — перед строкой, где начинается первый ход-вариант
      if (vm && ((i === vStart && i > 0) || (vStart === i + 1 && i > 0))) {
        html += '<div class="var-sep">—— ваш локальный вариант ——</div>';
      } else if (vm && vStart === 0 && i === 0) {
        html += '<div class="var-sep">—— ваш локальный вариант с начала партии ——</div>';
      }
      const cls = (idx) => (k === idx + 1 ? 'mv active' : 'mv') + (vm && idx >= vStart ? ' var' : '');
      const ply = (idx) => idx + 1;
      html += `<div class="mv-num">${i / 2 + 1}.</div>`;
      html += `<div class="${cls(i)}" data-ply="${ply(i)}">${esc(src[i].san)}</div>`;
      html += src[i + 1]
        ? `<div class="${cls(i + 1)}" data-ply="${ply(i + 1)}">${esc(src[i + 1].san)}</div>`
        : '<div></div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.mv').forEach(m => m.addEventListener('click', () => {
      cb().gotoMove(+m.getAttribute('data-ply'));
    }));
    const act = el.querySelector('.mv.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }

  // ── статус/шапка ─────────────────────────────────────────────────
  function renderMeta() {
    if (!data) return;
    $('bc-name').textContent = data.name || 'Трансляция';

    const badge = $('bc-badge');
    badge.className = 'bc-badge ' + data.status;
    badge.textContent = data.status === 'live' ? '● Live'
      : data.status === 'finished' ? (data.result || 'завершён')
      : data.status === 'upcoming' ? 'скоро'
      : 'ожидание';

    const g = games[gameIdx];
    const vm = varMode();
    const k = curPly();
    $('move-counter').textContent = k + ' / ' + (g ? g.hist.length : 0);
    let st = '';
    if (vm) {
      st = 'Локальный вариант — фигуры двигаете только вы, у остальных этого не видно. Вернитесь к трансляции, чтобы продолжить просмотр.';
    } else if (data.status === 'upcoming' || data.status === 'pending') {
      st = 'Начало: ' + fmtTime(data.startsAt);
    } else if (data.status === 'finished' && g) {
      st = 'Партия завершена: ' + (g.headers.Result || data.result || '');
    } else if (g && g.hist.length) {
      st = 'Идёт партия · ход ' + Math.ceil(k / 2);
    } else {
      st = 'Ожидание данных…';
    }
    $('bc-status').textContent = st;

    const ev = g ? g.headers.Event : null;
    const open = g ? (g.headers.Opening ? g.headers.Opening + (g.headers.ECO ? ' (' + g.headers.ECO + ')' : '') : '') : '';
    const tc = g ? g.headers.TimeControl : null;
    $('bc-info').innerHTML =
      '<h4>О трансляции</h4>' +
      (ev ? '<b>' + esc(ev) + '</b><br>' : '') +
      (data.description ? esc(data.description) + '<br>' : '') +
      (data.sourceUrl ? 'Источник: <a href="' + esc(data.sourceUrl) + '" target="_blank" rel="noopener">lichess.org</a><br>' : '') +
      (open ? 'Дебют: ' + esc(open) + '<br>' : '') +
      (tc ? 'Контроль: ' + esc(tc) : '') +
      '<br>Фигуры можно двигать — это ваш личный локальный вариант, у других зрителей его нет.';

    const sel = $('game-select');
    if (games.length > 1) {
      sel.style.display = '';
      if (sel.options.length !== games.length) {
        sel.innerHTML = games.map((gm, i) =>
          `<option value="${i}">${esc((gm.headers.White || 'W') + ' — ' + (gm.headers.Black || 'B'))}</option>`).join('');
        sel.value = String(gameIdx);
      }
    } else {
      sel.style.display = 'none';
    }

    const btnL = $('btn-latest');
    btnL.style.display = (games.length && !preview && (!isFollowing() || vm)) ? '' : 'none';
    btnL.textContent = vm
      ? (newLiveMoves ? '⤺ Вернуться к трансляции · есть новые ходы' : '⤺ Вернуться к трансляции')
      : '⤝ К последнему ходу';
    btnL.classList.toggle('pulse', vm && newLiveMoves);
    document.title = (data.name || 'Трансляция') + ' — Chess Home';
  }

  // ── загрузка данных ──────────────────────────────────────────────
  async function load() {
    if (stopped || document.hidden) return;
    let d;
    try { d = await apiGet('/broadcasts/' + encodeURIComponent(ID)); }
    catch (e) {
      if (e.status === 404) {
        stopped = true;
        $('bc-error').style.display = '';
        $('bc-error').textContent = 'Трансляция не найдена';
        return;
      }
      return;
    }
    data = d;

    if (d.updatedAt !== lastUpdatedAt) {
      lastUpdatedAt = d.updatedAt;
      const parsed = d.pgn ? parsePgn(d.pgn) : [];
      if (parsed.length) {
        const prevLen = games[gameIdx] ? games[gameIdx].hist.length : -1;
        games = parsed;
        if (gameIdx >= games.length) gameIdx = 0;
        const g2 = games[gameIdx];
        const grew = g2 && g2.hist.length > prevLen;
        // во время превью/варианта доску не трогаем
        if (preview) { /* ждём выхода из превью */ }
        else if (varMode()) { if (grew) newLiveMoves = true; }
        else { if (grew) newLiveMoves = false; syncGame(); }
        bcRender();
      }
    } else {
      renderMeta();
    }
  }

  // ── движок: 2 линии, как в анализе ───────────────────────────────
  const ENGINE_DEPTH = 10;
  const ENGINE_LINES = 2;

  function currentKey() {
    // в локальном варианте ключ по FEN — у варианта нет своего ply в PGN
    if (varMode()) return 'v' + gameIdx + ':' + cb().getViewFEN();
    return gameIdx + ':' + curPly();
  }
  function currentFen() {
    if (varMode()) return cb().getViewFEN(); // анализируем позицию варианта
    const g = games[gameIdx];
    const k = curPly();
    return g ? g.fens[Math.min(k, g.fens.length - 1)] : new Chess().fen();
  }

  function setStatus(txt) { $('engine-status').textContent = txt ? txt : ''; }

  function ensureEngine() {
    if (sf) return sfReady;
    try {
      sf = new Worker('/js/stockfish.js');
      sf.onmessage = (e) => onEngMsg(e.data || e);
      sf.onerror = () => { setStatus('ошибка'); sfReady = false; };
      sf.postMessage('uci');
      setStatus('загрузка…');
      return sfReady;
    } catch (e) { setStatus('ошибка'); return false; }
  }

  function onEngMsg(d) {
    const s = typeof d === 'string' ? d : (d.data || d.line || String(d));
    if (s.indexOf('uciok') === 0) {
      sfReady = true;
      // ВАЖНО: только MultiPV. Смена Threads/Hash в этом билде (2019,
      // multi-variant) без последующего isready «подвешивает» поиск.
      sf.postMessage('setoption name MultiPV value ' + ENGINE_LINES);
      sf.postMessage('isready');
      setStatus('готов');
      analyzeNow();
      return;
    }
    if (s.indexOf('readyok') === 0) { setStatus('готов'); }
    // info depth N ... multipv M ... score cp|mate X ... pv <ходы>
    const m = s.match(/\bdepth (\d+)\b.*\bmultipv (\d+)\b.*\bscore (cp|mate) (-?\d+)\b.*\bpv (.+)$/);
    if (m && engBusyKey) {
      const node = engNodes.get(engBusyKey);
      if (!node) return;
      const score = parseInt(m[4], 10);
      // pv в SAN + FEN-ы по каждому полуходу
      const scratch = new Chess();
      try { scratch.load(node.fen); } catch (e) { return; }
      const uciList = m[5].trim().split(/\s+/);
      const san = [], fens = [node.fen], pvUci = [];
      for (const u of uciList) {
        const mv = { from: u.slice(0, 2), to: u.slice(2, 4) };
        if (u.length > 4) mv.promotion = u[4];
        try { const r = scratch.move(mv); san.push(r.san); } catch (e) { break; }
        pvUci.push(u);
        fens.push(scratch.fen());
      }
      node.lines[+m[2]] = { score, type: m[3], depth: +m[1], turn: node.fen.split(' ')[1] || 'w', san, fens, pvUci };
      scheduleTreeRender();
    }
    if (s.indexOf('bestmove') === 0 && engBusyKey) {
      const node = engNodes.get(engBusyKey);
      if (node) node.done = true;
      engBusyKey = null;
      scheduleTreeRender();
    }
  }

  function analyzeNow() {
    if (!engineOn || !sfReady || stopped) return;
    const key = currentKey();
    let node = engNodes.get(key);
    if (!node) {
      node = { key, fen: currentFen(), ply: curPly(), gameIdx, lines: {}, done: false };
      // не разрастаемся: держим последние 8 позиций
      if (engNodes.size >= 8) {
        const first = engNodes.keys().next().value;
        if (preview && preview.key === first) preview = null;
        engNodes.delete(first);
      }
      engNodes.set(key, node);
      scheduleTreeRender();
    } else if (node.done || engBusyKey === key) {
      return;
    }
    if (engBusyKey && engBusyKey !== key) sf.postMessage('stop');
    engBusyKey = key;
    node.done = false;
    sf.postMessage('position fen ' + node.fen);
    sf.postMessage('go depth ' + ENGINE_DEPTH);
    setStatus('Анализирует…');
  }

  let treeTimer = null;
  function scheduleTreeRender() {
    if (treeTimer) { treeDirty = true; return; }
    renderTree();
    treeTimer = setTimeout(() => { treeTimer = null; if (treeDirty) { treeDirty = false; scheduleTreeRender(); } }, 150);
  }

  function fmtScore(line) {
    if (line.type === 'mate') {
      return line.score === 0 ? 'M0' : 'M' + Math.abs(line.score);
    }
    // perspective движка = сторона, чей ход; переводим в перспективу белых
    const cp = line.turn === 'w' ? line.score : -line.score;
    return (cp > 0 ? '+' : '') + (cp / 100).toFixed(1);
  }
  function scoreClass(line) {
    if (line.type === 'mate') return 'm';
    const cp = line.turn === 'w' ? line.score : -line.score;
    return cp >= 0 ? 'w' : 'b';
  }

  function renderTree() {
    if (!engineOn) { $('analysis-tree').innerHTML = '<div class="eng-hint">Анализ выключен.</div>'; return; }
    // шапка оценки — как в анализе: большая цифра + глубина + лучший ход
    const curNode = engNodes.get(currentKey());
    const main = curNode && curNode.lines[1];
    if (main && main.san.length) {
      const sc = $('eng-score');
      sc.textContent = fmtScore(main);
      sc.className = 'eng-score-big ' + scoreClass(main);
      $('eng-depth').textContent = main.depth;
      $('eng-best').textContent = main.san[0];
      setStatus(curNode.done ? 'Готов' : 'Анализирует…');
      $('engine-status').classList.toggle('thinking', !curNode.done);
    } else {
      $('eng-score').textContent = '—'; $('eng-score').className = 'eng-score-big';
      $('eng-depth').textContent = '—'; $('eng-best').textContent = '—';
      setStatus('Анализирует…');
      $('engine-status').classList.add('thinking');
    }

    // только линии текущей позиции (2 линии, как в анализе)
    const key = currentKey();
    const idxs = curNode ? Object.keys(curNode.lines).sort((a, b) => a - b) : [];
    if (!idxs.length) { $('analysis-tree').innerHTML = '<div class="eng-hint">Думаю…</div>'; return; }

    let html = '';
    for (const li of idxs) {
      const line = curNode.lines[li];
      if (!line.san.length) continue;
      html += '<div class="eng-line"><span class="eng-score ' + scoreClass(line) + '">' + fmtScore(line) + '</span><span class="eng-pv">';
      for (let j = 0; j < line.san.length; j++) {
        const mvNum = (curNode.ply + j) % 2 === 0 ? Math.ceil((curNode.ply + j + 1) / 2) + '. ' : '';
        const sel = preview && preview.key === key && preview.lineIdx === +li && preview.moveIdx === j + 1;
        html += '<span class="pvmove' + (sel ? ' sel' : '') + '" data-key="' + key + '" data-li="' + li + '" data-j="' + j + '">' + mvNum + esc(line.san[j]) + '</span> ';
      }
      html += '</span></div>';
    }
    $('analysis-tree').innerHTML = html;
    $('analysis-tree').querySelectorAll('.pvmove').forEach(el => {
      el.addEventListener('click', () => {
        const pKey = el.getAttribute('data-key');
        const node = engNodes.get(pKey);
        const line = node && node.lines[+el.getAttribute('data-li')];
        const j = +el.getAttribute('data-j') + 1;
        if (!line || !line.fens[j]) return;
        preview = { key: pKey, lineIdx: +el.getAttribute('data-li'), moveIdx: j, restorePly: curPly() };
        inProgram = true;
        try { cb().loadFEN(line.fens[j]); } catch (e) { preview = null; }
        inProgram = false;
        renderMoves(); renderMeta(); scheduleTreeRender();
      });
    });
    $('btn-back-game').style.display = preview ? '' : 'none';
  }

  function toggleEngine() {
    engineOn = !engineOn;
    const btn = $('btn-engine');
    btn.classList.toggle('on', engineOn);
    btn.textContent = engineOn ? '⏸ Движок включён' : '▶ Движок выключен';
    $('analysis-panel').style.display = engineOn ? '' : 'none';
    if (engineOn) {
      if (ensureEngine()) analyzeNow(); else renderTree();
    } else {
      if (sf) { sf.postMessage('stop'); sf.terminate(); sf = null; sfReady = false; }
      engNodes.clear(); preview = null; engBusyKey = null;
      setStatus('');
      $('engine-status').classList.remove('thinking');
      renderTree();
      // локальный вариант зрителя не трогаем — сбрасываем доску только если он не в варианте
      if (!varMode()) syncGame();
      bcRender();
    }
  }

  // ── навигация и управление ───────────────────────────────────────
  $('nav-first').addEventListener('click', () => cb().gotoFirst());
  $('nav-prev').addEventListener('click', () => cb().gotoPrev());
  $('nav-next').addEventListener('click', () => cb().gotoNext());
  $('nav-last').addEventListener('click', () => cb().gotoLast());
  $('btn-flip').addEventListener('click', () => cb().flipBoard());
  $('btn-latest').addEventListener('click', () => {
    preview = null;
    if (varMode()) { follow = true; newLiveMoves = false; syncGame(); }
    else { cb().gotoLast(); }
    bcRender();
  });
  $('btn-engine').addEventListener('click', toggleEngine);
  $('btn-back-game').addEventListener('click', () => {
    preview = null;
    syncGame();
    bcRender();
    scheduleTreeRender();
  });
  $('game-select').addEventListener('change', (e) => {
    gameIdx = +e.target.value; preview = null; newLiveMoves = false; follow = true; syncGame(); bcRender();
  });

  // стрелки ← → для листания ходов
  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') { cb().gotoPrev(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { cb().gotoNext(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { cb().gotoFirst(); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { cb().gotoLast(); e.preventDefault(); }
    else if (e.key === 'Escape') {
      if (preview) { preview = null; syncGame(); bcRender(); scheduleTreeRender(); }
      else if (varMode()) { follow = true; newLiveMoves = false; syncGame(); bcRender(); }
    }
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); loadChat(); } });

  // ── чат трансляции ────────────────────────────────────────────────
  let chatLoaded = false;
  function initChat() {
    if (me) {
      $('chat-form').style.display = '';
    } else {
      $('chat-login-hint').style.display = '';
      $('chat-login-hint').innerHTML = '<a href="/login">Войдите</a> на сайт, чтобы писать в чат.';
    }
  }

  async function loadChat() {
    if (!ID) return;
    let msgs;
    try { msgs = (await apiGet('/broadcasts/' + encodeURIComponent(ID) + '/chat')).messages || []; }
    catch (e) { return; }
    const box = $('chat-messages');
    if (!msgs.length && !chatLoaded) { box.innerHTML = '<div class="chat-hint">Пока нет сообщений — напишите первым!</div>'; chatLoaded = true; return; }
    chatLoaded = true;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    const prevLen = box.dataset.count ? +box.dataset.count : -1;
    if (msgs.length === prevLen) return; // без изменений
    box.dataset.count = msgs.length;
    const canModerate = (m) => me && (me.role === 'admin' || (me.username && me.username === m.userId));
    box.innerHTML = msgs.map(m => {
      const mine = me && me.username && me.username === m.userId;
      return '<div class="chat-msg' + (mine ? ' mine' : '') + '">' +
        '<div class="c-row"><span class="c-name">' + esc(m.username) + '</span>' +
        (canModerate(m) ? '<span class="c-del" data-mid="' + esc(m.id) + '" title="Удалить">✕</span>' : '') +
        '</div><div class="c-text">' + esc(m.text) + '</div></div>';
    }).join('') || '<div class="chat-hint">Пока нет сообщений.</div>';
    box.querySelectorAll('.c-del').forEach(el => el.addEventListener('click', async () => {
      try {
        await apiPost('/broadcasts/' + encodeURIComponent(ID) + '/chat/' + encodeURIComponent(el.getAttribute('data-mid')) + '/delete');
        box.dataset.count = '';
        loadChat();
      } catch (e) { /* нет прав */ }
    }));
    if (nearBottom) box.scrollTop = box.scrollHeight;
  }

  $('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const inp = $('chat-input');
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    try {
      await apiPost('/broadcasts/' + encodeURIComponent(ID) + '/chat', { text });
      $('chat-messages').dataset.count = '';
      loadChat();
    } catch (err) {
      inp.value = text;
      if (typeof toast === 'function') toast(err.message || 'Не удалось отправить', 'error');
    }
  });

  // ── старт ────────────────────────────────────────────────────────
  load();
  loadChat();
  setInterval(load, POLL_MS);
  setInterval(loadChat, 3000);
  // локальный тик часов каждую секунду
  setInterval(() => { if (liveClock && !document.hidden && !preview) { renderClocksOnly(); } }, 1000);

  // отладка (можно вызывать из консоли): состояние часов
  window.__bc = () => ({
    ply: curPly(), len: histLen(),
    varMode: varMode(),
    newLiveMoves,
    side: liveClock && liveClock.side,
    base: liveClock && liveClock.base,
    flipped: cb() && cb().flipped,
    status: data && data.status,
  });
})();
</script>

</body>
</html>
