<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/api.js"></script>
<script src="/js/pieces.js"></script>
<script src="/js/vendor/chess.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трансляция — Chess Home</title>
  <meta name="description" content="Трансляция партии в реальном времени">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  body { background: var(--bg-primary); color: var(--text-primary); margin: 0; }

  .bc-page { max-width: 1100px; margin: 0 auto; padding: 16px; padding-top: calc(var(--header-h, 60px) + 16px); }

  .bc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .bc-head .bc-name { font-size: 20px; font-weight: 700; }
  .bc-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-secondary); }
  .bc-badge.live { color: var(--red); border-color: var(--red); animation: bcPulse 1.4s infinite; }
  .bc-badge.finished { color: var(--green); border-color: var(--green); }
  .bc-badge.upcoming { color: var(--accent); border-color: var(--accent-dark); }
  @keyframes bcPulse { 0% { box-shadow: 0 0 0 0 rgba(224,85,85,.4); } 70% { box-shadow: 0 0 0 7px rgba(224,85,85,0); } 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0); } }

  .bc-layout { display: flex; gap: 16px; align-items: flex-start; }
  .bc-board-col { flex: 1; min-width: 0; }

  .bc-player {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 14px; margin-bottom: 8px; min-height: 38px;
  }
  .bc-player .p-name { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bc-player .p-rating { color: var(--text-secondary); font-size: 13px; }
  .bc-player .p-clock {
    font-family: monospace; font-size: 18px; font-weight: 700; padding: 2px 10px;
    border-radius: 6px; background: var(--bg-secondary); color: var(--text-secondary);
  }
  .bc-player .p-clock.turn { background: var(--accent); color: #161820; }

  #board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: min(100%, calc(100vh - 250px), 720px); max-width: 720px; aspect-ratio: 1 / 1;
    border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
    margin: 0 auto;
  }
  #board .sq { position: relative; }
  #board .sq.light { background: var(--board-light); }
  #board .sq.dark  { background: var(--board-dark); }
  #board .sq.hl::after { content: ''; position: absolute; inset: 0; background: var(--board-highlight); }
  #board .sq img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; pointer-events: none; }

  .bc-under { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; max-width: 720px; margin-left: auto; margin-right: auto; }
  .bc-status { color: var(--text-secondary); font-size: 13px; }
  .bc-btns .btn { margin-left: 6px; }

  .bc-side {
    width: 280px; flex: none; display: flex; flex-direction: column; gap: 10px;
  }
  .bc-info { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .bc-info b { color: var(--text-primary); }

  #movelist {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    flex: 1; min-height: 200px; max-height: calc(100vh - 300px); overflow-y: auto;
    padding: 8px; display: grid; grid-template-columns: 34px 1fr 1fr; gap: 2px 4px; align-content: start;
    font-size: 14px;
  }
  #movelist .mv-num { color: var(--text-muted); text-align: right; padding: 3px 6px 3px 0; }
  #movelist .mv { padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--text-primary); }
  #movelist .mv:hover { background: var(--bg-hover); }
  #movelist .mv.active { background: var(--accent-dark); color: #fff; }

  .bc-empty { text-align: center; color: var(--text-secondary); padding: 60px 0; }

  select#game-select {
    background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; max-width: 100%;
  }

  @media (max-width: 780px) {
    .bc-layout { flex-direction: column; }
    .bc-side { width: 100%; }
    #movelist { max-height: 300px; }
    #board { width: min(100%, calc(100vh - 320px)); }
  }
</style>
</head>
<body>

<header id="header">
  <a href="/" class="logo"><span class="logo-icon">♚</span> Chess Home</a>
  <nav>
    <ul class="nav-links">
      <li><a href="/lobby">🏆 Играть</a></li>
      <li><a href="/tv">📺 TV</a></li>
      <li><a href="/broadcasts" class="active">📡 Трансляции</a></li>
      <li><a href="/analysis">🔍 Анализ</a></li>
    </ul>
  </nav>
  <div class="header-right" id="header-right"></div>
</header>

<div class="bc-page">
  <div class="bc-head">
    <div class="bc-name" id="bc-name">Загрузка…</div>
    <div class="bc-badge" id="bc-badge"></div>
    <select id="game-select" style="display:none"></select>
  </div>

  <div class="bc-layout">
    <div class="bc-board-col">
      <div class="bc-player" id="bar-top"><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>
      <div id="board"></div>
      <div class="bc-player" id="bar-bottom" style="margin-top:8px"><span class="p-name">—</span><span class="p-rating"></span><span class="p-clock">—</span></div>
      <div class="bc-under">
        <div class="bc-status" id="bc-status"></div>
        <div class="bc-btns">
          <button class="btn btn-ghost btn-sm" id="btn-latest" style="display:none">⏭ К последнему ходу</button>
          <button class="btn btn-ghost btn-sm" id="btn-flip">⇅ Перевернуть</button>
        </div>
      </div>
    </div>

    <div class="bc-side">
      <div class="bc-info" id="bc-info">—</div>
      <div id="movelist"></div>
    </div>
  </div>

  <div class="bc-empty" id="bc-error" style="display:none"></div>
</div>

<script>
(function () {
  'use strict';

  const ID = location.pathname.split('/')[2] || '';
  const POLL_MS = 2000;

  // ── состояние ────────────────────────────────────────────────────
  let data = null;            // ответ сервера
  let games = [];             // распарсенные партии PGN
  let gameIdx = 0;
  let viewPly = -1;           // сколько ходов показываем; -1 = последний
  let follow = true;          // следить за последним ходом
  let flipped = false;
  let lastUpdatedAt = null;
  let stopped = false;

  // ── утилиты ──────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtTime(ms) {
    if (!ms) return '';
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  // ── парсинг PGN ──────────────────────────────────────────────────
  // Возвращает массив партий: headers, san-история, FEN-позиции по ходам, часы.
  function parsePgn(pgnText) {
    const chunks = pgnText.split(/\n(?=\[Event )/).map(s => s.trim()).filter(s => s.startsWith('[Event'));
    const out = [];
    for (const chunk of chunks) {
      const headers = {};
      chunk.replace(/\[(\w+)\s+"([^"]*)"\]/g, (m, k, v) => { headers[k] = v; return m; });
      const clk = [];
      chunk.replace(/\[%clk\s+([^\]\s]+)\s*\]/g, (m, v) => { clk.push(v); return m; });
      const evals = [];
      chunk.replace(/\[%eval\s+([^\]\s,]+)/g, (m, v) => { evals.push(v); return m; });

      try {
        const g = new Chess();
        g.loadPgn(chunk);
        const hist = g.history({ verbose: true });
        // FEN-позиции после каждого хода (и начальная на индексе 0)
        const tmp = new Chess();
        const fens = [tmp.fen()];
        for (const mv of hist) { try { tmp.move(mv.san); } catch (e) { break; } fens.push(tmp.fen()); }
        if (hist.length) out.push({ headers, clk, evals, hist, fens });
      } catch (e) { /* битый блок — пропускаем */ }
    }
    return out;
  }

  // ── доска ────────────────────────────────────────────────────────
  function fenBoard(fen) {
    const board = {};
    const rows = fen.split(' ')[0].split('/');
    for (let r = 0; r < 8; r++) {
      let file = 0;
      for (const ch of rows[r]) {
        if (ch >= '1' && ch <= '8') { file += +ch; continue; }
        const sq = 'abcdefgh'[file] + (8 - r);
        board[sq] = { t: ch.toLowerCase(), c: (ch === ch.toLowerCase()) ? 'b' : 'w' };
        file++;
      }
    }
    return board;
  }

  function renderBoard() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    const fen = g ? g.fens[Math.min(k, g.fens.length - 1)] : new Chess().fen();
    const lastMove = (g && k > 0) ? g.hist[k - 1] : null;

    const board = fenBoard(fen);
    const el = $('board');
    el.innerHTML = '';
    const files = flipped ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
    const ranks = flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];

    for (const r of ranks) {
      for (const f of files) {
        const sq = f + r;
        const cell = document.createElement('div');
        const dark = (files.indexOf(f) + r) % 2 === 0;
        cell.className = 'sq ' + (dark ? 'dark' : 'light');
        if (lastMove && (lastMove.from === sq || lastMove.to === sq)) cell.classList.add('hl');
        const p = board[sq];
        if (p) {
          const img = document.createElement('img');
          img.src = PIECE_IMGS[p.c + p.t.toUpperCase()];
          img.alt = '';
          cell.appendChild(img);
        }
        el.appendChild(cell);
      }
    }
  }

  // ── часы: последнее известное время каждой стороны на позиции k ──
  function clocksAt(g, k) {
    let w = null, b = null;
    for (let i = 0; i < k && i < g.clk.length; i++) {
      if (i % 2 === 0) w = g.clk[i]; else b = g.clk[i];
    }
    return { w, b };
  }

  // ── панели игроков ───────────────────────────────────────────────
  function playerName(g, side, fallback) {
    if (g && g.headers[side === 'w' ? 'White' : 'Black']) {
      const h = g.headers[side === 'w' ? 'White' : 'Black'];
      const elo = g.headers[side === 'w' ? 'WhiteElo' : 'BlackElo'];
      const title = g.headers[side === 'w' ? 'WhiteTitle' : 'BlackTitle'] || '';
      return { name: (title ? title + ' ' : '') + h, elo: elo || '' };
    }
    const fb = fallback ? fallback.split(/[,/]/).map(s => s.trim()) : [];
    const name = side === 'w' ? (data && data.white) || fb[0] : (data && data.black) || fb[1];
    return { name: name || (side === 'w' ? 'Белые' : 'Чёрные'), elo: '' };
  }

  function renderPlayers() {
    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    const turn = k % 2 === 0 ? 'w' : 'b';
    const clk = g ? clocksAt(g, k) : { w: null, b: null };

    const bottomSide = flipped ? 'b' : 'w';
    const topSide = flipped ? 'w' : 'b';
    const fb = (data && data.white && data.black) ? data.white + '/' + data.black : '';

    const fill = (elId, side) => {
      const p = playerName(g, side, fb);
      const el = $(elId);
      el.querySelector('.p-name').textContent = p.name;
      el.querySelector('.p-rating').textContent = p.elo ? '(' + p.elo + ')' : '';
      const c = el.querySelector('.p-clock');
      c.textContent = (side === 'w' ? clk.w : clk.b) || '—';
      c.classList.toggle('turn', !!((side === 'w' ? clk.w : clk.b)) && turn === side);
    };
    fill('bar-top', topSide);
    fill('bar-bottom', bottomSide);
  }

  // ── список ходов ─────────────────────────────────────────────────
  function renderMoves() {
    const g = games[gameIdx];
    const el = $('movelist');
    if (!g || !g.hist.length) {
      el.style.display = 'none';
      return;
    }
    el.style.display = '';
    const k = (viewPly < 0) ? g.hist.length : viewPly;
    let html = '';
    for (let i = 0; i < g.hist.length; i += 2) {
      html += `<div class="mv-num">${i / 2 + 1}.</div>`;
      html += `<div class="mv${(k === i + 1) ? ' active' : ''}" data-ply="${i + 1}">${esc(g.hist[i].san)}</div>`;
      html += g.hist[i + 1]
        ? `<div class="mv${(k === i + 2) ? ' active' : ''}" data-ply="${i + 2}">${esc(g.hist[i + 1].san)}</div>`
        : '<div></div>';
    }
    el.innerHTML = html;
    el.querySelectorAll('.mv').forEach(m => m.addEventListener('click', () => {
      viewPly = +m.getAttribute('data-ply');
      follow = false;
      renderAll();
    }));
    // автоскролл к текущему ходу
    const act = el.querySelector('.mv.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }

  // ── статус/шапка ─────────────────────────────────────────────────
  function renderMeta() {
    if (!data) return;
    $('bc-name').textContent = data.name || 'Трансляция';

    const badge = $('bc-badge');
    badge.className = 'bc-badge ' + data.status;
    badge.textContent = data.status === 'live' ? 'LIVE'
      : data.status === 'finished' ? (data.result || 'завершён')
      : data.status === 'upcoming' ? 'скоро'
      : 'ожидание';

    const g = games[gameIdx];
    const k = (viewPly < 0) ? (g ? g.hist.length : 0) : viewPly;
    let st = '';
    if (data.status === 'upcoming' || data.status === 'pending') {
      st = 'Начало: ' + fmtTime(data.startsAt);
    } else if (data.status === 'finished' && g) {
      st = 'Партия завершена: ' + (g.headers.Result || data.result || '');
    } else if (g && g.hist.length) {
      st = 'Идёт партия · ход ' + Math.ceil(k / 2);
    } else {
      st = 'Ожидание данных…';
    }
    $('bc-status').textContent = st;

    // инфо-панель
    const ev = g ? g.headers.Event : null;
    const open = g ? (g.headers.Opening ? g.headers.Opening + (g.headers.ECO ? ' (' + g.headers.ECO + ')' : '') : '') : '';
    const tc = g ? g.headers.TimeControl : null;
    $('bc-info').innerHTML =
      (ev ? '<b>' + esc(ev) + '</b><br>' : '') +
      (data.sourceUrl ? 'Источник: <a href="' + esc(data.sourceUrl) + '" target="_blank" rel="noopener" style="color:var(--accent)">lichess.org</a><br>' : '') +
      (open ? 'Дебют: ' + esc(open) + '<br>' : '') +
      (tc ? 'Контроль: ' + esc(tc) : '');

    // выбор партии (если в раунде несколько досок)
    const sel = $('game-select');
    if (games.length > 1) {
      sel.style.display = '';
      if (sel.options.length !== games.length) {
        sel.innerHTML = games.map((gm, i) =>
          `<option value="${i}">${esc((gm.headers.White || 'W') + ' — ' + (gm.headers.Black || 'B'))}</option>`).join('');
        sel.value = String(gameIdx);
      }
    } else {
      sel.style.display = 'none';
    }

    $('btn-latest').style.display = (games.length && !follow && viewPly !== (games[gameIdx] ? games[gameIdx].hist.length : 0)) ? '' : 'none';
    document.title = (data.name || 'Трансляция') + ' — Chess Home';
  }

  function renderAll() { renderBoard(); renderPlayers(); renderMoves(); renderMeta(); }

  // ── загрузка данных ──────────────────────────────────────────────
  async function load() {
    if (stopped || document.hidden) return;
    let d;
    try { d = await apiGet('/broadcasts/' + encodeURIComponent(ID)); }
    catch (e) {
      if (e.status === 404) {
        stopped = true;
        $('bc-error').style.display = '';
        $('bc-error').textContent = 'Трансляция не найдена';
        return;
      }
      return; // сеть моргнула — попробуем на следующем тике
    }
    data = d;

    if (d.updatedAt !== lastUpdatedAt) {
      lastUpdatedAt = d.updatedAt;
      const parsed = d.pgn ? parsePgn(d.pgn) : [];
      if (parsed.length) {
        games = parsed;
        if (gameIdx >= games.length) gameIdx = 0;
        if (follow) viewPly = -1;
      }
      renderAll();
    } else {
      renderMeta(); // статус/часы могли обновиться
    }
  }

  // ── контролы ─────────────────────────────────────────────────────
  $('btn-flip').addEventListener('click', () => { flipped = !flipped; renderBoard(); renderPlayers(); });
  $('btn-latest').addEventListener('click', () => { follow = true; viewPly = -1; renderAll(); });
  $('game-select').addEventListener('change', (e) => {
    gameIdx = +e.target.value; viewPly = -1; follow = true; renderAll();
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  // ── старт ────────────────────────────────────────────────────────
  renderBoard(); // стартовая позиция до загрузки данных
  load();
  setInterval(load, POLL_MS);
})();
</script>

</body>
</html>
