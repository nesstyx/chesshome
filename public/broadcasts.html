<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/toast.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="broadcasts.page_title">Трансляции — Chess Home</title>
  <meta name="description" content="Трансляции шахматных соревнований в реальном времени — Chess Home">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/header/core.js"></script>
  <script src="/js/header/styles.js"></script>
  <script src="/js/header/render.js"></script>
  <script src="/js/header/right.js"></script>
  <script src="/js/header/api.js"></script>
  <link rel="icon" type="image/png" href="/img/logo/favicon.png">
<style>
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); }

  /* ── PAGE ─────────────────────────────────────────────── */
  .bc-page { max-width: 920px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── HERO ─────────────────────────────────────────────── */
  .bc-hero { text-align: center; padding: 28px 0 30px; position: relative; }
  .bc-hero::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: min(420px, 100%); height: 210px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.13) 0%, transparent 70%);
    pointer-events: none;
  }
  .bc-hero-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px;
    background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.28);
    font-size: 28px; margin-bottom: 14px;
  }
  .bc-hero h1 {
    font-family: var(--font-display); font-size: 40px; font-weight: 700;
    margin: 0 0 8px; letter-spacing: -0.5px; color: var(--text-primary);
  }
  .bc-hero h1 span { color: var(--accent); }
  .bc-hero p { color: var(--text-secondary); font-size: 15px; margin: 0; }

  /* ── TABS ─────────────────────────────────────────────── */
  .bc-tabs {
    display: flex; justify-content: center; gap: 8px; margin: 0 0 22px; flex-wrap: wrap;
  }
  .bc-tab {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 20px; padding: 7px 18px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--font-body); transition: all .15s;
  }
  .bc-tab:hover { color: var(--text-primary); border-color: var(--border-light); }
  .bc-tab.active { background: var(--accent); border-color: var(--accent); color: #161820; }
  .bc-tab .cnt { opacity: .75; font-weight: 500; margin-left: 4px; }

  /* ── CARD ─────────────────────────────────────────────── */
  .bc-card {
    display: flex; align-items: stretch; gap: 0;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
    cursor: pointer; transition: transform .18s, border-color .18s, box-shadow .18s;
    position: relative;
  }
  .bc-card:hover { transform: translateY(-2px); border-color: var(--accent-dark); box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(201,168,76,.08); }

  .bc-stripe { width: 4px; flex: none; background: var(--border); }
  .bc-stripe.live { background: var(--red); }
  .bc-stripe.upcoming { background: var(--accent); }
  .bc-stripe.paused, .bc-stripe.pending { background: var(--text-muted); }
  .bc-stripe.finished { background: var(--green); }

  .bc-inner { flex: 1; min-width: 0; padding: 16px 18px; display: flex; align-items: center; gap: 14px; }

  .bc-status-pill {
    flex: none; display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    color: var(--text-secondary); background: var(--bg-secondary);
    min-width: 86px; justify-content: center;
  }
  .bc-status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .bc-status-pill.live { color: var(--red); border-color: rgba(224,85,85,.45); background: rgba(224,85,85,.08); }
  .bc-status-pill.live .dot { background: var(--red); animation: bcPulse 1.4s infinite; }
  .bc-status-pill.upcoming { color: var(--accent-light); border-color: rgba(201,168,76,.45); background: rgba(201,168,76,.08); }
  .bc-status-pill.upcoming .dot { background: var(--accent); }
  .bc-status-pill.finished { color: var(--green); border-color: rgba(76,175,114,.4); background: rgba(76,175,114,.08); }
  .bc-status-pill.finished .dot { background: var(--green); }
  @keyframes bcPulse { 0% { box-shadow: 0 0 0 0 rgba(224,85,85,.55); } 70% { box-shadow: 0 0 0 7px rgba(224,85,85,0); } 100% { box-shadow: 0 0 0 0 rgba(224,85,85,0); } }

  .bc-main { flex: 1; min-width: 0; }
  .bc-name {
    font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
  }
  .bc-players {
    color: var(--text-secondary); font-size: 13.5px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bc-players b { color: var(--text-primary); font-weight: 600; }
  .bc-meta { color: var(--text-muted); font-size: 12px; margin-top: 5px; }

  .bc-right { flex: none; text-align: right; line-height: 1.6; }
  .bc-when { color: var(--text-secondary); font-size: 13px; }
  .bc-when b { color: var(--text-primary); font-weight: 600; }
  .bc-result { color: var(--green); font-weight: 700; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; }

  .bc-del {
    flex: none; align-self: center; margin-right: 14px;
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
    transition: all .15s;
  }
  .bc-del:hover { border-color: var(--red); color: var(--red); background: rgba(224,85,85,.08); }

  .bc-empty {
    text-align: center; padding: 70px 20px; color: var(--text-secondary); font-size: 15px;
    border: 1px dashed var(--border-light); border-radius: var(--radius); background: rgba(30,32,40,.4);
  }
  .bc-empty .big { font-size: 42px; margin-bottom: 12px; }

  /* ── ADMIN FORM ───────────────────────────────────────── */
  .bc-admin {
    background: linear-gradient(180deg, rgba(201,168,76,.05) 0%, transparent 40%), var(--bg-card);
    border: 1px solid var(--border-light); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 26px;
  }
  .bc-admin h3 {
    margin: 0 0 16px; font-size: 14px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .bc-admin h3::before { content: ''; width: 20px; height: 2px; background: var(--accent); border-radius: 2px; }
  .bc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .bc-grid .full { grid-column: 1 / -1; }
  .bc-admin label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; font-weight: 600; }
  .bc-admin input {
    width: 100%; box-sizing: border-box; background: var(--bg-secondary); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 8px; padding: 10px 12px; font-size: 14px;
    font-family: var(--font-body); transition: border-color .15s;
  }
  .bc-admin input:focus { outline: none; border-color: var(--accent-dark); box-shadow: 0 0 0 3px rgba(201,168,76,.1); }
  .bc-admin .btn { margin-top: 16px; }
  .bc-err { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; }

  @media (max-width: 640px) {
    .bc-hero h1 { font-size: 28px; }
    .bc-grid { grid-template-columns: 1fr; }
    .bc-inner { flex-wrap: wrap; }
    .bc-status-pill { order: -1; }
    .bc-right { width: 100%; text-align: left; margin-top: 4px; }
  }
</style>
</head>
<body>

<!-- header injected by /js/header.js -->

<div class="bc-page">

  <!-- HERO -->
  <div class="bc-hero">
    <div class="bc-hero-badge">📡</div>
    <h1>Шахматные <span>Трансляции</span></h1>
    <p>Соревнования в реальном времени — партии обновляются автоматически</p>
  </div>

  <!-- Админ: добавление трансляции -->
  <div class="bc-admin" id="bc-admin" style="display:none">
    <h3>Новая трансляция</h3>
    <div class="bc-grid">
      <div class="full">
        <label>Название *</label>
        <input id="f-name" maxlength="120" placeholder="FIDE World Chess Championship 2026 — Game 1">
      </div>
      <div>
        <label>Дата и время начала *</label>
        <input id="f-starts" type="datetime-local">
      </div>
      <div>
        <label>Ссылка на раунд Lichess</label>
        <input id="f-url" placeholder="https://lichess.org/broadcast/.../xLgOJ6cb">
      </div>
      <div class="full">
        <label>Описание</label>
        <input id="f-desc" maxlength="500" placeholder="Матч на звание чемпиона мира">
      </div>
    </div>
    <button class="btn btn-primary" id="f-save">Создать трансляцию</button>
    <div class="bc-err" id="f-err"></div>
  </div>

  <!-- TABS -->
  <div class="bc-tabs" id="bc-tabs" style="display:none">
    <button class="bc-tab active" data-f="all">Все<span class="cnt" id="cnt-all"></span></button>
    <button class="bc-tab" data-f="live">● Live<span class="cnt" id="cnt-live"></span></button>
    <button class="bc-tab" data-f="upcoming">Скоро<span class="cnt" id="cnt-upcoming"></span></button>
    <button class="bc-tab" data-f="finished">Завершённые<span class="cnt" id="cnt-finished"></span></button>
  </div>

  <div id="bc-list"><div class="bc-empty"><div class="big">📡</div>Загрузка…</div></div>
</div>

<script>
(function () {
  'use strict';

  let me = null;
  let allList = [];
  let filter = 'all';

  const STATUS_LABEL = {
    live: 'Live', upcoming: 'Скоро', paused: 'Пауза', pending: 'Ожидание', finished: 'Финал',
  };

  function fmtTime(ms) {
    if (!ms) return '—';
    return new Date(ms).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function moveWord(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'ход';
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'хода';
    return 'ходов';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ── header ─────────────────────────────────────────────
  if (window.CH && typeof CH.initHeader === 'function') CH.initHeader();

  async function loadMe() {
    try {
      me = await apiGet('/me');
      if (me && window.CH && typeof CH.setCurrentUser === 'function') CH.setCurrentUser(me);
      if (me && me.role === 'admin') document.getElementById('bc-admin').style.display = '';
    } catch (e) { /* не залогинен */ }
  }

  // ── tabs ───────────────────────────────────────────────
  document.getElementById('bc-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.bc-tab');
    if (!b) return;
    filter = b.getAttribute('data-f');
    document.querySelectorAll('.bc-tab').forEach(t => t.classList.toggle('active', t === b));
    renderList();
  });

  // ── список ─────────────────────────────────────────────
  async function load() {
    try { allList = await apiGet('/broadcasts'); }
    catch (e) {
      document.getElementById('bc-list').innerHTML =
        '<div class="bc-empty"><div class="big">⚠️</div>Не удалось загрузить список</div>';
      return;
    }
    updateTabs();
    renderList();
  }

  function updateTabs() {
    if (!allList.length) return;
    document.getElementById('bc-tabs').style.display = '';
    const cnt = (f) => allList.filter(b => (f === 'all') ? true : (f === 'live' ? (b.status === 'live' || b.status === 'paused') : b.status === f)).length;
    document.getElementById('cnt-all').textContent = allList.length || '';
    document.getElementById('cnt-live').textContent = cnt('live') || '';
    document.getElementById('cnt-upcoming').textContent = cnt('upcoming') || '';
    document.getElementById('cnt-finished').textContent = cnt('finished') || '';
  }

  function renderList() {
    const c = document.getElementById('bc-list');
    const list = allList.filter(b => (filter === 'all') ? true : (filter === 'live' ? (b.status === 'live' || b.status === 'paused') : b.status === filter));

    if (!allList.length) {
      c.innerHTML = '<div class="bc-empty"><div class="big">♟</div>Пока нет ни одной трансляции</div>';
      return;
    }
    if (!list.length) {
      c.innerHTML = '<div class="bc-empty"><div class="big">🔍</div>В этой категории ничего нет</div>';
      return;
    }

    c.innerHTML = list.map(b => {
      const del = (me && me.role === 'admin')
        ? `<button class="bc-del" data-del="${b.id}" title="Удалить">✕</button>` : '';
      const players = (b.white || b.black)
        ? `<b>${esc(b.white || '—')}</b> — <b>${esc(b.black || '—')}</b>` + (b.plies ? ` <span style="color:var(--text-muted)">· ${Math.ceil(b.plies / 2)} ${moveWord(Math.ceil(b.plies / 2))}</span>` : '')
        : (b.description ? esc(b.description) : '');
      return `
      <div class="bc-card" data-open="${b.id}">
        <div class="bc-stripe ${esc(b.status)}"></div>
        <div class="bc-inner">
          <div class="bc-status-pill ${esc(b.status)}"><span class="dot"></span>${STATUS_LABEL[b.status] || ''}</div>
          <div class="bc-main">
            <div class="bc-name">${esc(b.name)}</div>
            ${players ? `<div class="bc-players">${players}</div>` : ''}
            <div class="bc-meta">Начало: ${fmtTime(b.startsAt)}</div>
          </div>
          <div class="bc-right">
            ${b.status === 'finished' && b.result ? `<div class="bc-result">${esc(b.result)}</div>` : ''}
          </div>
          ${del}
        </div>
      </div>`;
    }).join('');

    c.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', (ev) => {
        if (ev.target.closest('[data-del]')) return;
        location.href = '/broadcasts/' + el.getAttribute('data-open');
      });
    });
    c.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', async () => {
        if (!confirm('Удалить трансляцию?')) return;
        try { await apiPost('/broadcasts/' + el.getAttribute('data-del') + '/delete', {}); load(); }
        catch (e) { alert(e.message); }
      });
    });
  }

  // ── создание ───────────────────────────────────────────
  async function create() {
    const err = document.getElementById('f-err');
    err.textContent = '';
    const name = document.getElementById('f-name').value.trim();
    const startsRaw = document.getElementById('f-starts').value;
    const url = document.getElementById('f-url').value.trim();
    const desc = document.getElementById('f-desc').value.trim();
    if (!name) { err.textContent = 'Укажите название'; return; }
    if (!startsRaw) { err.textContent = 'Укажите дату и время'; return; }
    const startsAt = new Date(startsRaw).getTime();
    try {
      await apiPost('/broadcasts', { name, startsAt, sourceUrl: url || undefined, description: desc || undefined });
      document.getElementById('f-name').value = '';
      document.getElementById('f-url').value = '';
      document.getElementById('f-desc').value = '';
      load();
    } catch (e) { err.textContent = e.message; }
  }

  document.getElementById('f-save').addEventListener('click', create);

  loadMe();
  load();
  setInterval(() => { if (!document.hidden) load(); }, 10000);
})();
</script>

</body>
</html>
